<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Face Detector</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .app {
      width: min(900px, 100%);
      text-align: center;
    }
    h1 { margin: 0 0 8px; }
    p { color: #aeb8d0; margin-top: 0; }
    .camera {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 18px;
      background: #050812;
      border: 1px solid #26304b;
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas { pointer-events: none; }
    .status {
      margin: 14px auto;
      padding: 12px 16px;
      border-radius: 12px;
      background: #151d32;
      color: #dce4ff;
      max-width: 600px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #6c7cff;
      color: white;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .count {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🤖 AI Yüz Algılama</h1>
    <p>İlk prototip — kamera görüntüsündeki yüzleri gerçek zamanlı algılar.</p>

    <div class="camera">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div id="status" class="status">Model hazırlanıyor...</div>
    <button id="startBtn" disabled>Kamerayı Başlat</button>
    <div id="count" class="count">Yüz: 0</div>
  </main>

  <script type="module">
    import { FaceDetector, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const count = document.getElementById("count");

    let detector = null;
    let stream = null;
    let running = false;

    function showError(message) {
      status.textContent = "⚠️ " + message;
      status.style.color = "#ffb4b4";
    }

    async function loadModel() {
      try {
        status.textContent = "⏳ 1/4 MediaPipe kütüphanesi yükleniyor...";

        const vision = await import(LIB_URL);
        FaceDetector = vision.FaceDetector;
        FilesetResolver = vision.FilesetResolver;

        if (!FaceDetector || !FilesetResolver) {
          throw new Error("MediaPipe modülü yüklendi fakat gerekli sınıflar bulunamadı.");
        }

        status.textContent = "⏳ 2/4 WebAssembly motoru yükleniyor...";

        const visionFiles = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        status.textContent = "⏳ 3/4 Yüz algılama modeli indiriliyor...";

        detector = await FaceDetector.createFromOptions(visionFiles, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_detector/face_detector/short_range/float16/1/face_detector.tflite"
          },
          runningMode: "VIDEO",
          minDetectionConfidence: 0.5
        });

        status.textContent = "✅ 4/4 AI modeli hazır! Kamerayı başlatabilirsin.";
        startBtn.disabled = false;

      } catch (error) {
        console.error("AI başlatma hatası:", error);

        let reason = error?.message || String(error);

        if (reason.includes("Failed to fetch") || reason.includes("NetworkError")) {
          reason += "\n\nİnternet/CDN erişimi başarısız.";
        }

        showError("AI başlatılamadı.\n\n" + reason);
      }
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        running = true;
        startBtn.textContent = "Kamera Açık";
        startBtn.disabled = true;
        status.textContent = "🟢 Kamera açık — yüz aranıyor...";
        requestAnimationFrame(detect);
      } catch (error) {
        console.error(error);
        if (error.name === "NotAllowedError") {
          showError("Kamera izni verilmedi. Tarayıcı ayarlarından kamera iznini aç.");
        } else {
          showError("Kamera açılamadı: " + error.message);
        }
      }
    }

    function resizeCanvas() {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    function detect() {
      if (!running || !detector || video.readyState < 2) {
        if (running) requestAnimationFrame(detect);
        return;
      }

      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      try {
        const result = detector.detectForVideo(video, performance.now());
        const faces = result.detections || [];

        count.textContent = "Yüz: " + faces.length;

        for (const face of faces) {
          const box = face.boundingBox;
          if (!box) continue;

          ctx.strokeStyle = "#00ff88";
          ctx.lineWidth = Math.max(3, canvas.width / 300);
          ctx.strokeRect(box.originX, box.originY, box.width, box.height);

          ctx.fillStyle = "#00ff88";
          ctx.font = `${Math.max(18, canvas.width / 35)}px Arial`;
          ctx.fillText(
            "Yüz",
            box.originX,
            Math.max(25, box.originY - 8)
          );
        }

        status.textContent = faces.length
          ? "🟢 Yüz algılandı!"
          : "🔎 Yüz aranıyor...";
      } catch (error) {
        console.error(error);
        showError("Yüz algılama sırasında hata oluştu.");
      }

      requestAnimationFrame(detect);
    }

    startBtn.addEventListener("click", startCamera);

    if (location.protocol !== "https:" && location.hostname !== "localhost") {
      status.textContent =
        "⚠️ Uyarı: Sayfa HTTPS üzerinden çalışmıyor.\n" +
        "GitHub Pages kullanıyorsan adresin https:// ile başlamalı.";
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      showError("Bu tarayıcı kamera erişimini desteklemiyor.");
    } else {
      loadModel();
    }
  </script>
</body>
</html>
