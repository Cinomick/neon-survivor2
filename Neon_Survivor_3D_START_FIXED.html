<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Survivor 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:#eaf7ff;font-family:system-ui,Arial,sans-serif}
#game{position:fixed;inset:0} canvas{display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:8px;padding:12px}
.panel{background:rgba(2,10,18,.78);border:1px solid #75dcff44;border-radius:12px;padding:9px 12px}
.stats{display:flex;gap:12px}.meter{width:130px;height:9px;background:#12202c;border-radius:8px;overflow:hidden;margin-top:4px}
.fill{height:100%;width:100%}.hp{background:#ff5378}.xp{background:#4edbff}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;z-index:50}
#cross:before,#cross:after{content:"";position:absolute;background:white;box-shadow:0 0 8px #5ee7ff}
#cross:before{width:24px;height:2px;top:11px}.crossv{height:24px;width:2px;left:11px;top:0;position:absolute;background:white}
#boss{position:absolute;left:50%;top:12px;transform:translateX(-50%);min-width:280px;display:none;text-align:center}
.bossbar{height:11px;background:#241a0d;border-radius:8px;overflow:hidden;margin-top:5px}.bossfill{height:100%;background:#ffb648}
#status{position:absolute;left:12px;bottom:12px;font-size:13px}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:auto;width:min(600px,92vw)}
.title{font-size:56px;margin:0;text-shadow:0 0 30px #52ddff}.subtitle{opacity:.8;margin:6px 0 20px}
button{border:0;border-radius:10px;padding:14px 26px;background:#55dcff;color:#04101a;font-weight:900;font-size:16px;cursor:pointer}
#pause,#upgrade{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#02070dcc;pointer-events:auto}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(900px,92vw)}
.card{padding:18px;border-radius:14px;border:1px solid #5ee0ff55;background:#091927;cursor:pointer;min-height:150px}
.enemyBar{position:fixed;width:62px;height:7px;background:#000b;border:1px solid #fff8;border-radius:4px;transform:translate(-50%,-50%);z-index:40;pointer-events:none}
.enemyBarFill{height:100%;width:100%;background:#ff3f62}.enemyBarBoss{width:90px;height:9px}.enemyBarBoss .enemyBarFill{background:#ffb84d}
#mini{position:absolute;right:12px;bottom:12px;width:120px;height:120px;background:#020912cc;border:1px solid #7de5ff44;border-radius:9px}
#mobileControls{display:none;position:fixed;inset:0;z-index:100;pointer-events:none;touch-action:none}
.mobileBtn{position:absolute;width:70px;height:70px;border-radius:50%;pointer-events:auto;border:2px solid #96ebff66;background:#0a2334aa;color:white;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
#stick{left:22px;bottom:24px;width:130px;height:130px;border-radius:50%;position:absolute;pointer-events:auto;border:2px solid #6ee1ff55;background:#46d2ff18;touch-action:none}
#knob{position:absolute;width:56px;height:56px;left:50%;top:50%;margin:-28px;border-radius:50%;background:#5fdcff55;border:2px solid #b4f5ff99}
#fire{right:24px;bottom:35px;width:88px;height:88px;background:#ff466922;border-color:#ff6b87aa}
#run{right:125px;bottom:35px}.mobileBtn#pauseBtn{right:18px;top:110px;width:52px;height:52px}
@media(max-width:900px) and (pointer:coarse){
 #mobileControls{display:block}.top{padding:7px;font-size:11px}.panel{padding:6px 8px}.meter{width:75px;height:7px}
 #status{display:none}.title{font-size:34px}.cards{grid-template-columns:1fr}.card{min-height:105px;padding:12px}
}
</style>
</head>
<body>
<div id="game"></div>
<div class="ui">
 <div class="top">
  <div class="panel"><b>NEON SURVIVOR // 3D</b><div class="stats">
   <span>❤️ <b id="hpTxt">100/100</b><div class="meter"><div id="hp" class="fill hp"></div></div></span>
   <span>⚡ LV <b id="lv">1</b><div class="meter"><div id="xp" class="fill xp"></div></div></span>
  </div></div>
  <div class="panel">Skor <b id="score">0</b> · Dalga <b id="wave">1</b> · Combo <b id="combo">0</b><br>Düşman <b id="alive">0</b></div>
 </div>
 <div id="boss" class="panel"><b id="bossName">BOSS</b><div class="bossbar"><div id="bossHp" class="bossfill"></div></div></div>
 <div id="cross"><div class="crossv"></div></div>
 <div id="enemyBars"></div>
 <div id="status" class="panel">WASD hareket · Mouse kamera · Sol tık ateş · Shift koş · P duraklat</div>
 <canvas id="mini" width="120" height="120"></canvas>
 <div id="center"><h1 class="title">NEON SURVIVOR</h1><div class="subtitle" id="message">3D Cyber Arena</div><button id="startBtn" type="button">OYUNA BAŞLA</button></div>
 <div id="upgrade"><div><h2 style="text-align:center">SEVİYE ATLADIN</h2><div id="cards" class="cards"></div></div></div>
 <div id="pause"><div class="panel" style="text-align:center"><h2>DURAKLATILDI</h2><p>Devam etmek için P'ye bas.</p></div></div>
 <div id="mobileControls">
  <div id="stick"><div id="knob"></div></div><div id="fire" class="mobileBtn">ATEŞ</div>
  <div id="run" class="mobileBtn">KOŞ</div><div id="pauseBtn" class="mobileBtn">Ⅱ</div>
 </div>
</div>

<script>
(function(){
  const btn=document.getElementById("startBtn");
  const msg=document.getElementById("message");
  let ready=false, pending=false;
  function start(){
    if(window.startGame){ window.startGame(); return; }
    pending=true; msg.textContent="Motor yükleniyor…";
  }
  btn.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();start();});
  btn.addEventListener("touchend",function(e){e.preventDefault();e.stopPropagation();start();},{passive:false});
  window.addEventListener("error",function(e){
    if(!ready){ msg.textContent="Oyun yüklenemedi: "+(e.message||"bilinmeyen hata"); btn.disabled=false; }
  });
  function load(src,ok,fail){
    const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=fail; document.head.appendChild(s);
  }
  function boot(){
    ready=true;
    try { (0,eval)(document.getElementById("engineCode").textContent); }
    catch(e){ console.error(e); msg.textContent="Başlatma hatası: "+(e.message||e); return; }
    if(pending && window.startGame) window.startGame();
  }
  load("https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js",boot,function(){
    msg.textContent="Ana motor alınamadı, alternatif deneniyor…";
    load("https://unpkg.com/three@0.180.0/build/three.min.js",boot,function(){
      msg.textContent="Three.js yüklenemedi. İnternet bağlantını kontrol et.";
    });
  });
})();
</script>
<script id="engineCode" type="text/plain">

"use strict";

/* ---------- BASIC ENGINE ---------- */
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050b13);
scene.fog=new THREE.FogExp2(0x06101b,.018);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
$("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9cdcff,0x06111b,1.5));
const light=new THREE.DirectionalLight(0x88ddff,1.5);
light.position.set(20,40,10);scene.add(light);

const ARENA=70, MAX_ENEMIES=15;
const keys=Object.create(null), bullets=[], enemies=[], drops=[], particles=[];
let player=null, running=false, paused=false, lastTime=0;
let spawnTimer=0, shotTimer=0, elapsed=0, wave=1, score=0, combo=0, comboTimer=0;
let xp=0,nextXp=120,level=1, cameraYaw=0,cameraPitch=0, pointerLocked=false;

const bossTypes=[
 {name:"VOID REAPER",power:"VOID DASH",color:0xff4d8d,hp:1500,speed:2.5,cooldown:3},
 {name:"NEON TITAN",power:"SHOCKWAVE",color:0xffb84d,hp:2100,speed:1.65,cooldown:3.5},
 {name:"PLASMA WARDEN",power:"PLASMA BURST",color:0x8f6bff,hp:1800,speed:2,cooldown:2.8}
];
let bossWave=0;

/* ---------- WORLD ---------- */
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(ARENA*2,ARENA*2),
 new THREE.MeshStandardMaterial({color:0x07131f,roughness:.9,metalness:.15})
);
ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(ARENA*2,32,0x1b5872,0x123042);
grid.position.y=.02;scene.add(grid);

for(let i=0;i<26;i++){
 const h=THREE.MathUtils.randFloat(1,7);
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(THREE.MathUtils.randFloat(1,3),h,THREE.MathUtils.randFloat(1,3)),
  new THREE.MeshStandardMaterial({color:0x0c2534,emissive:0x042e44,emissiveIntensity:.5})
 );
 m.position.set(THREE.MathUtils.randFloat(-67,67),h/2,THREE.MathUtils.randFloat(-67,67));
 scene.add(m);
}

/* ---------- PLAYER ---------- */
function createPlayer(){
 const group=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(.65,1.5,6,12),
  new THREE.MeshStandardMaterial({color:0xdffcff,emissive:0x0c7898,emissiveIntensity:.7})
 );
 body.position.y=1.25;group.add(body);
 const visor=new THREE.Mesh(
  new THREE.BoxGeometry(.65,.25,.8),
  new THREE.MeshStandardMaterial({color:0x9cffff,emissive:0x25dfff,emissiveIntensity:1.5})
 );
 visor.position.set(0,1.58,.38);group.add(visor);
 const gun=new THREE.Mesh(
  new THREE.BoxGeometry(.24,.23,1.6),
  new THREE.MeshStandardMaterial({color:0x172d3b,emissive:0x147ea0,emissiveIntensity:.6})
 );
 gun.position.set(.55,1.2,.7);group.add(gun);
 const muzzle=new THREE.PointLight(0x55ddff,8,3);
 muzzle.position.set(.55,1.2,1.65);muzzle.visible=false;group.add(muzzle);
 scene.add(group);
 group.visible=false;
 return {group,muzzle,hp:100,maxHp:100,speed:10,damage:20,fireRate:.20,multi:1,crit:.08,magnet:7,killHeal:0,inv:0};
}
player=createPlayer();
camera.position.set(0,1.65,0);

/* ---------- ENEMIES ---------- */
function makeEnemyMesh(type,boss){
 const info=boss?bossTypes[Math.floor(wave/5-1)%bossTypes.length]:null;
 const color=boss?info.color:(type===0?0xff386f:type===1?0xa66bff:0x35d7ff);
 const g=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.IcosahedronGeometry(boss?2.2:.8,boss?2:1),
  new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.1})
 );
 body.position.y=boss?2.3:1;g.add(body);
 if(boss){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.8,.08,6,24),new THREE.MeshBasicMaterial({color}));
  ring.rotation.x=Math.PI/2;ring.position.y=.3;g.add(ring);
 }
 return g;
}
function spawnEnemy(forceBoss=false){
 const normalCount=enemies.filter(e=>!e.dead).length;
 if(!forceBoss && normalCount>=MAX_ENEMIES)return;
 const side=Math.floor(Math.random()*4),p=ARENA-3;
 let x,z;
 if(side===0){x=-p;z=THREE.MathUtils.randFloat(-p,p)}
 else if(side===1){x=p;z=THREE.MathUtils.randFloat(-p,p)}
 else if(side===2){z=-p;x=THREE.MathUtils.randFloat(-p,p)}
 else {z=p;x=THREE.MathUtils.randFloat(-p,p)}
 const boss=forceBoss,type=Math.floor(Math.random()*3);
 const bi=boss?bossTypes[Math.floor(wave/5-1)%bossTypes.length]:null;
 const hp=boss?bi.hp:40+wave*7;
 const mesh=makeEnemyMesh(type,boss);
 mesh.position.set(x,0,z);scene.add(mesh);
 const bar=document.createElement("div");
 bar.className="enemyBar"+(boss?" enemyBarBoss":"");
 bar.innerHTML='<div class="enemyBarFill"></div>';
 $("enemyBars").appendChild(bar);
 enemies.push({
  mesh,boss,type,x,z,hp,maxHp:hp,
  speed:boss?bi.speed:(type===0?3.1:type===1?2.3:4.4),
  damage:boss?24:10+wave*.55,r:boss?2.2:.8,
  attack:0,power:boss?bi.cooldown:0,dead:false,dying:false,death:0,bar,barFill:bar.firstElementChild,bossInfo:bi
 });
 if(boss){
  $("bossName").textContent=bi.name+" · "+bi.power;
  $("boss").style.display="block";
 }
}
function killNormalsForBoss(){
 enemies.forEach(e=>{if(!e.boss&&!e.dying)beginDeath(e,true)});
}

/* ---------- FX / DEATH ---------- */
function burst(x,z,color,count){
 const n=Math.min(count,25);
 for(let i=0;i<n;i++){
  if(particles.length>90)break;
  const m=new THREE.Mesh(new THREE.SphereGeometry(.07,5,5),new THREE.MeshBasicMaterial({color,transparent:true}));
  m.position.set(x,Math.random()*1.5,z);scene.add(m);
  particles.push({m,vx:(Math.random()-.5)*7,vy:Math.random()*7,vz:(Math.random()-.5)*7,life:.55});
 }
}
function beginDeath(e,fromBoss=false){
 if(e.dying)return;
 e.dying=true;e.death=0;if(e.bar)e.bar.style.display="none";
 burst(e.x,e.z,e.boss?0xffb64d:0x63dcff,e.boss?25:9);
 if(!fromBoss){
  score+=e.boss?2500:12*(1+Math.floor(combo/10));combo++;comboTimer=2.4;
  gainXP(e.boss?220:18);
  if(player.killHeal)player.hp=Math.min(player.maxHp,player.hp+player.killHeal);
 }
}
function updateDeath(e,dt){
 e.death+=dt;const t=Math.min(1,e.death/.8);
 e.mesh.rotation.z=t*Math.PI*.5;e.mesh.rotation.x=t*.35;
 e.mesh.position.y=Math.max(0,1.8*t);e.mesh.scale.setScalar(1-t*.72);
 e.mesh.traverse(o=>{if(o.material){o.material.transparent=true;o.material.opacity=1-t}});
 if(e.death>=.8){scene.remove(e.mesh);e.bar.remove();e.dead=true}
}

/* ---------- GAME ---------- */
const upgrades=[
 ["Overclock","Atış hızını artır.",p=>p.fireRate*=.82],
 ["Titan Core","Maksimum can +35 ve iyileş.",p=>{p.maxHp+=35;p.hp=p.maxHp}],
 ["Rail Rounds","Hasar +35%.",p=>p.damage*=1.35],
 ["Twin Barrel","Mermi sayısı +1.",p=>p.multi=Math.min(5,p.multi+1)],
 ["Nanobots","Öldürmede can yenile.",p=>p.killHeal+=4],
 ["Magnet Core","XP çekim alanı büyür.",p=>p.magnet+=14],
 ["Plasma Crit","Kritik şansı +10%.",p=>p.crit+=.1],
 ["Thrusters","Hareket hızı +16%.",p=>p.speed*=1.16]
];
function gainXP(n){
 xp+=n;
 if(xp>=nextXp){xp-=nextXp;nextXp=Math.round(nextXp*1.25);level++;openUpgrade()}
}
function openUpgrade(){
 paused=true;$("upgrade").style.display="flex";const box=$("cards");box.innerHTML="";
 upgrades.slice().sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{
  const d=document.createElement("div");d.className="card";
  d.innerHTML="<h3>"+u[0]+"</h3><p>"+u[1]+"</p><small>Seç</small>";
  d.onclick=()=>{u[2](player);$("upgrade").style.display="none";paused=false;updateUI()};
  box.appendChild(d);
 });
}
function hurt(n){
 if(player.inv>0)return;
 player.hp-=n;player.inv=.42;burst(player.group.position.x,player.group.position.z,0xff4b72,7);
 if(player.hp<=0){
  running=false;$("center").style.display="block";$("startBtn").textContent="TEKRAR OYNA";
  $("message").textContent="Oyun bitti · Skor "+score+" · Dalga "+wave;
 }
}
function fire(){
 if(!running||paused||shotTimer>0||bullets.length>=60)return;
 shotTimer=player.fireRate;
 const dir=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw));
 for(let i=0;i<player.multi&&bullets.length<60;i++){
  const d=dir.clone();
  d.applyAxisAngle(new THREE.Vector3(0,1,0),(i-(player.multi-1)/2)*.055);
  const crit=Math.random()<player.crit;
  const b={pos:new THREE.Vector3(player.group.position.x,1.5,player.group.position.z).addScaledVector(d,1.2),dir:d,speed:36,life:1.6,damage:player.damage*(crit?2:1),crit};
  b.mesh=new THREE.Mesh(new THREE.SphereGeometry(.11,6,6),new THREE.MeshBasicMaterial({color:crit?0xffffff:0x62e4ff}));
  b.mesh.position.copy(b.pos);scene.add(b.mesh);bullets.push(b);
 }
 player.muzzle.visible=true;setTimeout(()=>player.muzzle.visible=false,40);
}
function bossPower(e){
 const dx=player.group.position.x-e.x,dz=player.group.position.z-e.z,dist=Math.hypot(dx,dz)||1;
 if(e.bossInfo.power==="VOID DASH"){
  e.x=THREE.MathUtils.clamp(e.x+dx/dist*10,-67,67);e.z=THREE.MathUtils.clamp(e.z+dz/dist*10,-67,67);
  e.mesh.position.set(e.x,0,e.z);if(Math.hypot(player.group.position.x-e.x,player.group.position.z-e.z)<4)hurt(18);
 }else if(e.bossInfo.power==="SHOCKWAVE"){
  if(dist<12)hurt(28);burst(e.x,e.z,e.bossInfo.color,20);
 }else{
  if(dist<18)hurt(22);burst(player.group.position.x,player.group.position.z,e.bossInfo.color,15);
 }
}
function update(dt){
 if(!running||paused)return;
 elapsed+=dt;shotTimer-=dt;spawnTimer-=dt;comboTimer-=dt;player.inv-=dt;
 wave=1+Math.floor(elapsed/25);
 if(wave%5===0&&bossWave!==wave){
  bossWave=wave;killNormalsForBoss();spawnEnemy(true);
 }
 if(spawnTimer<=0&&wave%5!==0){spawnTimer=Math.max(.35,1.05-wave*.045);spawnEnemy()}
 const sy=Math.sin(cameraYaw),cy=Math.cos(cameraYaw);
 let mx=0,mz=0;
 if(keys.KeyW){mx+=sy;mz+=cy}if(keys.KeyS){mx-=sy;mz-=cy}
 if(keys.KeyA){mx+=cy;mz-=sy}if(keys.KeyD){mx-=cy;mz+=sy}
 const len=Math.hypot(mx,mz)||1,run=(keys.ShiftLeft||keys.ShiftRight)?1.55:1;
 if(mx||mz){
  player.group.position.x=THREE.MathUtils.clamp(player.group.position.x+mx/len*player.speed*run*dt,-68,68);
  player.group.position.z=THREE.MathUtils.clamp(player.group.position.z+mz/len*player.speed*run*dt,-68,68);
 }
 if(keys.Mouse0)fire();
 camera.position.set(player.group.position.x,1.65,player.group.position.z);
 const cp=Math.cos(cameraPitch),sp=Math.sin(cameraPitch);
 camera.lookAt(camera.position.x+Math.sin(cameraYaw)*cp,camera.position.y+sp,camera.position.z+Math.cos(cameraYaw)*cp);

 bullets.forEach(b=>{b.pos.addScaledVector(b.dir,b.speed*dt);b.mesh.position.copy(b.pos);b.life-=dt});
 bullets.forEach(b=>{if(b.life<=0)return;for(const e of enemies){if(e.dying)continue;if(Math.hypot(b.pos.x-e.x,b.pos.z-e.z)<e.r+.45){b.life=0;e.hp-=b.damage;burst(e.x,e.z,e.boss?0xffb64d:0x6fdfff,2);break}}});
 bullets.filter(b=>b.life<=0).forEach(b=>scene.remove(b.mesh));bullets.splice(0,bullets.length,...bullets.filter(b=>b.life>0));

 for(const e of enemies){
  if(e.dead)continue;if(e.dying){updateDeath(e,dt);continue}
  const dx=player.group.position.x-e.x,dz=player.group.position.z-e.z,dist=Math.hypot(dx,dz)||1;
  e.x+=dx/dist*e.speed*dt;e.z+=dz/dist*e.speed*dt;e.mesh.position.set(e.x,0,e.z);
  e.mesh.rotation.y=Math.atan2(dx,dz);
  e.attack-=dt;e.power-=dt;
  if(dist<e.r+1.15&&e.attack<=0){hurt(e.damage);e.attack=e.boss?.75:.9}
  if(e.boss&&e.power<=0){bossPower(e);e.power=e.bossInfo.cooldown}
  const p=new THREE.Vector3(e.x,e.boss?3.7:2.5,e.z);p.project(camera);
  const visible=p.z>-1&&p.z<1&&p.x>-1.1&&p.x<1.1&&p.y>-1.1&&p.y<1.1;
  e.bar.style.display=visible?"block":"none";
  if(visible){e.bar.style.left=((p.x*.5+.5)*innerWidth)+"px";e.bar.style.top=((-p.y*.5+.5)*innerHeight)+"px";e.barFill.style.width=Math.max(0,e.hp/e.maxHp*100)+"%"}
  if(e.hp<=0)beginDeath(e);
 }
 enemies.splice(0,enemies.length,...enemies.filter(e=>!e.dead));

 for(const p of particles){p.life-=dt;p.vy-=16*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.material.opacity=Math.max(0,p.life*2)}
 particles.filter(p=>p.life<=0).forEach(p=>scene.remove(p.m));particles.splice(0,particles.length,...particles.filter(p=>p.life>0));
 if(comboTimer<=0)combo=0;
 const boss=enemies.find(e=>e.boss&&!e.dying);$("boss").style.display=boss?"block":"none";if(boss)$("bossHp").style.width=(boss.hp/boss.maxHp*100)+"%";
 updateUI();drawMini();
}
function updateUI(){
 $("hpTxt").textContent=Math.max(0,Math.ceil(player.hp))+"/"+player.maxHp;
 $("hp").style.width=Math.max(0,player.hp/player.maxHp*100)+"%";
 $("xp").style.width=(xp/nextXp*100)+"%";$("lv").textContent=level;$("score").textContent=score;$("wave").textContent=wave;$("combo").textContent=combo;$("alive").textContent=enemies.length;
}
function drawMini(){
 const c=$("mini"),g=c.getContext("2d"),s=c.width;g.clearRect(0,0,s,s);g.fillStyle="#05111c";g.fillRect(0,0,s,s);
 const sc=s/(ARENA*2);g.fillStyle="#61e1ff";g.fillRect(s/2+player.group.position.x*sc-2,s/2+player.group.position.z*sc-2,4,4);
 enemies.forEach(e=>{g.fillStyle=e.boss?"#ffb84d":"#ff5175";g.fillRect(s/2+e.x*sc-1,s/2+e.z*sc-1,e.boss?5:2,e.boss?5:2)});
}

/* ---------- START: intentionally independent and tiny ---------- */
function startGame(){
 if(running)return;
 try{
  running=true;paused=false;elapsed=0;wave=1;score=0;combo=0;comboTimer=0;xp=0;nextXp=120;level=1;spawnTimer=0;shotTimer=0;bossWave=0;
  player.hp=player.maxHp=100;player.speed=10;player.damage=20;player.fireRate=.20;player.multi=1;player.crit=.08;player.magnet=7;player.killHeal=0;player.group.position.set(0,0,0);
  enemies.forEach(e=>{scene.remove(e.mesh);e.bar.remove()});enemies.length=0;
  bullets.forEach(b=>scene.remove(b.mesh));bullets.length=0;
  particles.forEach(p=>scene.remove(p.m));particles.length=0;
  $("center").style.display="none";$("pause").style.display="none";$("upgrade").style.display="none";
  updateUI();
 }catch(err){
  running=false;
  console.error(err);
  $("message").textContent="Başlatma hatası: "+(err.message||err);
 }
}
window.startGame=startGame;

/* ---------- DESKTOP INPUT ---------- */
renderer.domElement.addEventListener("click",()=>{if(running&&!paused&&!mobileEnabled())renderer.domElement.requestPointerLock?.()});
document.addEventListener("pointerlockchange",()=>{pointerLocked=document.pointerLockElement===renderer.domElement});
document.addEventListener("mousemove",e=>{if(running&&!paused&&pointerLocked){cameraYaw-=e.movementX*.0025;cameraPitch=THREE.MathUtils.clamp(cameraPitch-e.movementY*.002,-1.35,1.35)}});
document.addEventListener("mousedown",e=>{if(e.button===0&&!mobileEnabled()){keys.Mouse0=true;if(running&&!paused)fire()}});
document.addEventListener("mouseup",e=>{if(e.button===0)keys.Mouse0=false});
document.addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="KeyP"&&running){paused=!paused;$("pause").style.display=paused?"flex":"none"}});
document.addEventListener("keyup",e=>keys[e.code]=false);

/* ---------- MOBILE ---------- */
function mobileEnabled(){return matchMedia("(pointer:coarse)").matches&&innerWidth<=900}
const mobile={moveId:null,lookId:null,x:0,y:0,fire:false,run:false,lastX:0,lastY:0};
const stick=$("stick"),knob=$("knob");
function stickSet(x,y){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;
 let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}
 mobile.x=dx/max;mobile.y=dy/max;knob.style.transform="translate("+dx+"px,"+dy+"px)";
}
function stickReset(){mobile.x=mobile.y=0;knob.style.transform="translate(0,0)";keys.KeyW=keys.KeyS=keys.KeyA=keys.KeyD=false}
stick.addEventListener("touchstart",e=>{if(!running||paused)return;const t=e.changedTouches[0];mobile.moveId=t.identifier;stickSet(t.clientX,t.clientY);e.preventDefault()},{passive:false});
stick.addEventListener("touchmove",e=>{const t=[...e.changedTouches].find(t=>t.identifier===mobile.moveId);if(t){stickSet(t.clientX,t.clientY);e.preventDefault()}},{passive:false});
stick.addEventListener("touchend",e=>{if([...e.changedTouches].some(t=>t.identifier===mobile.moveId)){mobile.moveId=null;stickReset()}},{passive:false});
stick.addEventListener("touchcancel",stickReset);

$("fire").addEventListener("touchstart",e=>{mobile.fire=true;if(running&&!paused)fire();e.preventDefault()},{passive:false});
$("fire").addEventListener("touchend",e=>{mobile.fire=false;e.preventDefault()},{passive:false});
$("run").addEventListener("touchstart",e=>{mobile.run=true;e.preventDefault()},{passive:false});
$("run").addEventListener("touchend",e=>{mobile.run=false;e.preventDefault()},{passive:false});
$("pauseBtn").addEventListener("touchstart",e=>{if(running){paused=!paused;$("pause").style.display=paused?"flex":"none"}e.preventDefault()},{passive:false});
document.addEventListener("touchstart",e=>{
 if(!mobileEnabled()||!running||paused)return;
 for(const t of e.changedTouches){
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(el?.closest("#stick,.mobileBtn"))continue;
  if(t.clientX>innerWidth*.38&&mobile.lookId===null){mobile.lookId=t.identifier;mobile.lastX=t.clientX;mobile.lastY=t.clientY}
 }
},{passive:false});
document.addEventListener("touchmove",e=>{
 if(mobile.lookId===null||paused)return;
 const t=[...e.changedTouches].find(t=>t.identifier===mobile.lookId);if(!t)return;
 cameraYaw-=(t.clientX-mobile.lastX)*.006;cameraPitch=THREE.MathUtils.clamp(cameraPitch-(t.clientY-mobile.lastY)*.004,-1.35,1.35);
 mobile.lastX=t.clientX;mobile.lastY=t.clientY;e.preventDefault();
},{passive:false});
document.addEventListener("touchend",e=>{if([...e.changedTouches].some(t=>t.identifier===mobile.lookId))mobile.lookId=null},{passive:false});

/* Apply mobile input before each frame. */
function applyMobile(){
 if(!mobileEnabled()||!running||paused)return;
 keys.KeyW=mobile.y<-.08;keys.KeyS=mobile.y>.08;keys.KeyA=mobile.x<-.08;keys.KeyD=mobile.x>.08;
 keys.ShiftLeft=mobile.run;keys.Mouse0=mobile.fire;
}

/* ---------- LOOP ---------- */
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(.033,(t-lastTime)/1000||0);lastTime=t;
 applyMobile();update(dt);renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
updateUI();drawMini();requestAnimationFrame(frame);

</script>
</body>
</html>
