<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#080b14"
>

<title>AI Yüz Algılama</title>


<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"
  crossorigin="anonymous">
</script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 18px;

  background: #080b14;

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}

.app {

  width:
    min(900px, 100%);

  margin:
    auto;

  text-align:
    center;

}

h1 {

  margin:
    0 0 8px;

  font-size:
    32px;

}

.subtitle {

  color:
    #9faac3;

  margin-bottom:
    22px;

}


/* =====================================================
   KAMERA ALANI
===================================================== */

.camera {

  position:
    relative;

  width:
    100%;

  aspect-ratio:
    16 / 10;

  background:
    #02040a;

  border:
    1px solid #29334d;

  border-radius:
    18px;

  overflow:
    hidden;

}

video,
#uploadedImage,
canvas {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

}

video {

  object-fit:
    cover;

  transform:
    scaleX(-1);

}

#uploadedImage {

  display:
    none;

  object-fit:
    contain;

  background:
    #02040a;

}

canvas {

  pointer-events:
    none;

  transform:
    scaleX(-1);

}


/* =====================================================
   DURUM
===================================================== */

.status {

  margin-top:
    14px;

  padding:
    16px;

  background:
    #151b2c;

  border-radius:
    14px;

  text-align:
    left;

  white-space:
    pre-wrap;

  line-height:
    1.6;

}

.success {

  color:
    #9dffca;

}

.error {

  color:
    #ff9b9b;

}


/* =====================================================
   BUTONLAR
===================================================== */

.buttons {

  display:
    flex;

  gap:
    10px;

  margin-top:
    14px;

}

button {

  flex:
    1;

  border:
    0;

  border-radius:
    12px;

  padding:
    15px;

  font-size:
    16px;

  font-weight:
    bold;

  color:
    white;

  background:
    #5365ff;

}

button.secondary {

  background:
    #252d42;

}

button.photo {

  background:
    #7c4dff;

}

button:disabled {

  opacity:
    .4;

}


/* =====================================================
   İSTATİSTİKLER
===================================================== */

.stats {

  display:
    grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:
    10px;

  margin-top:
    14px;

}

.stat {

  background:
    #11182a;

  border-radius:
    14px;

  padding:
    16px;

}

.stat b {

  display:
    block;

  font-size:
    25px;

  margin-bottom:
    5px;

}

.stat span {

  color:
    #9faac3;

}


/* =====================================================
   FOTOĞRAF SEÇİMİ
===================================================== */

.photoInputWrapper {

  position:
    relative;

  margin-top:
    10px;

}

.photoInputWrapper input {

  display:
    none;

}

.photoLabel {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    100%;

  padding:
    15px;

  border-radius:
    12px;

  background:
    #7c4dff;

  color:
    white;

  font-size:
    16px;

  font-weight:
    bold;

  cursor:
    pointer;

}

.photoLabel:active {

  transform:
    scale(.98);

}


/* =====================================================
   TEŞHİS
===================================================== */

.diagnostics {

  margin-top:
    14px;

  padding:
    16px;

  background:
    #0e1422;

  border:
    1px solid #202a40;

  border-radius:
    14px;

  text-align:
    left;

}

.diagnostics h2 {

  margin:
    0 0 10px;

  font-size:
    18px;

}

pre {

  margin:
    0;

  white-space:
    pre-wrap;

  color:
    #cdd6ec;

  font-family:
    monospace;

  font-size:
    13px;

  line-height:
    1.7;

}


/* =====================================================
   YÜZ BİLGİSİ
===================================================== */

.faceInfo {

  display:
    none;

  margin-top:
    14px;

  padding:
    16px;

  background:
    #10182b;

  border-radius:
    14px;

  text-align:
    left;

}

.faceInfo.visible {

  display:
    block;

}

.faceInfo h2 {

  margin:
    0 0 10px;

  font-size:
    18px;

}

.faceItem {

  padding:
    10px 0;

  border-bottom:
    1px solid #26314a;

}

.faceItem:last-child {

  border-bottom:
    none;

}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width: 600px) {

  body {

    padding:
      14px;

  }

  h1 {

    font-size:
      27px;

  }

  .buttons {

    flex-direction:
      column;

  }

}

</style>

</head>


<body>


<div class="app">


<h1>
  🤖 AI Yüz Algılama
</h1>


<div class="subtitle">
  Gerçek zamanlı yüz algılama sistemi
</div>


<!-- =====================================================
     GÖRÜNTÜ
===================================================== -->

<div class="camera">


  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <img
    id="uploadedImage"
    alt="Yüklenen fotoğraf"
  >


  <canvas
    id="canvas">
  </canvas>


</div>


<!-- =====================================================
     DURUM
===================================================== -->

<div
  id="status"
  class="status">

  ⏳ AI sistemi hazırlanıyor...

</div>


<!-- =====================================================
     KAMERA BUTONLARI
===================================================== -->

<div class="buttons">


  <button
    id="startBtn"
    disabled>

    📷 Kamerayı Başlat

  </button>


  <button
    id="stopBtn"
    class="secondary"
    disabled>

    ⏹ Kamerayı Durdur

  </button>


</div>


<!-- =====================================================
     FOTOĞRAF
===================================================== -->

<div class="photoInputWrapper">

  <label
    for="photoInput"
    class="photoLabel">

    🖼️ Fotoğraf Seç ve Analiz Et

  </label>


  <input
    id="photoInput"
    type="file"
    accept="image/*"
  >

</div>


<button
  id="cameraModeBtn"
  class="secondary"
  style="width:100%; margin-top:10px;"
  disabled>

  📷 Kameraya Dön

</button>


<!-- =====================================================
     İSTATİSTİKLER
===================================================== -->

<div class="stats">


  <div class="stat">

    <b id="faceCount">
      0
    </b>

    <span>
      Yüz
    </span>

  </div>


  <div class="stat">

    <b id="fps">
      0
    </b>

    <span>
      FPS
    </span>

  </div>


  <div class="stat">

    <b id="confidence">
      0%
    </b>

    <span>
      Güven
    </span>

  </div>


  <div class="stat">

    <b id="position">
      —
    </b>

    <span>
      Konum
    </span>

  </div>


</div>


<!-- =====================================================
     YÜZLER
===================================================== -->

<div
  id="faceInfo"
  class="faceInfo">

  <h2>
    👤 Algılanan Yüzler
  </h2>

  <div id="faceList"></div>

</div>


<!-- =====================================================
     SİSTEM
===================================================== -->

<div class="diagnostics">

  <h2>
    🔧 Sistem Durumu
  </h2>

  <pre id="diagnostics">
Başlatılıyor...
  </pre>

</div>


</div>



<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const ctx =
  canvas.getContext(
    "2d"
  );

const uploadedImage =
  document.getElementById(
    "uploadedImage"
  );

const status =
  document.getElementById(
    "status"
  );

const startBtn =
  document.getElementById(
    "startBtn"
  );

const stopBtn =
  document.getElementById(
    "stopBtn"
  );

const cameraModeBtn =
  document.getElementById(
    "cameraModeBtn"
  );

const photoInput =
  document.getElementById(
    "photoInput"
  );

const faceCount =
  document.getElementById(
    "faceCount"
  );

const fpsElement =
  document.getElementById(
    "fps"
  );

const confidenceElement =
  document.getElementById(
    "confidence"
  );

const positionElement =
  document.getElementById(
    "position"
  );

const diagnostics =
  document.getElementById(
    "diagnostics"
  );

const faceInfo =
  document.getElementById(
    "faceInfo"
  );

const faceList =
  document.getElementById(
    "faceList"
  );


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let faceDetection =
  null;

let stream =
  null;

let running =
  false;

let photoMode =
  false;

let photoURL =
  null;

let animationFrame =
  null;

let frameCount =
  0;

let lastFpsTime =
  performance.now();


/* =====================================================
   DURUM SİSTEMİ
===================================================== */

const states = {};


function setState(
  name,
  success,
  message
) {

  states[name] = {

    success:
      success,

    message:
      message

  };

  renderStates();

}


function renderStates() {

  diagnostics.textContent =
    Object.entries(states)
      .map(
        ([name, item]) => {

          return (

            (
              item.success
                ? "✅ "
                : "❌ "
            )

            +

            name

            +

            " — "

            +

            item.message

          );

        }
      )
      .join("\n");

}


/* =====================================================
   HATA
===================================================== */

function showError(
  message
) {

  status.textContent =
    "❌ HATA\n\n" +
    message;

  status.className =
    "status error";

}


/* =====================================================
   MEDIAPIPE BAŞLAT
===================================================== */

function initializeAI() {

  try {


    /*
    HTTPS
    */

    const httpsOK =
      location.protocol ===
      "https:" ||
      location.hostname ===
      "localhost";


    setState(
      "HTTPS",
      httpsOK,
      httpsOK
        ? "Güvenli bağlantı"
        : "HTTPS gerekli"
    );


    /*
    Kamera API
    */

    const cameraAPI =
      !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      );


    setState(
      "Kamera API",
      cameraAPI,
      cameraAPI
        ? "Tarayıcı destekliyor"
        : "Kamera API bulunamadı"
    );


    /*
    MediaPipe
    */

    if (
      typeof FaceDetection ===
      "undefined"
    ) {

      throw new Error(
        "MediaPipe FaceDetection yüklenemedi."
      );

    }


    faceDetection =
      new FaceDetection({

        locateFile:
          function(file) {

            return (
              "https://cdn.jsdelivr.net/npm/" +
              "@mediapipe/face_detection/" +
              file
            );

          }

      });


    /*
    Ayarlar
    */

    faceDetection.setOptions({

      model:
        "short",

      selfieMode:
        true,

      minDetectionConfidence:
        0.5

    });


    /*
    Sonuç callback
    */

    faceDetection.onResults(
      onResults
    );


    setState(
      "MediaPipe",
      true,
      "Face Detection yüklendi"
    );


    setState(
      "Yüz modeli",
      true,
      "BlazeFace hazır"
    );


    setState(
      "AI sistemi",
      true,
      "Çalışmaya hazır"
    );


    status.textContent =
      "✅ AI sistemi hazır!\n\n" +
      "Kamerayı başlatabilir veya " +
      "bir fotoğraf seçebilirsin.";

    status.className =
      "status success";


    startBtn.disabled =
      false;


  }

  catch (error) {

    console.error(
      error
    );


    setState(
      "AI sistemi",
      false,
      error.message ||
      String(error)
    );


    showError(
      "MediaPipe başlatılamadı.\n\n" +
      (
        error.message ||
        String(error)
      )
    );

  }

}


/* =====================================================
   KAMERA BAŞLAT
===================================================== */

async function startCamera() {

  try {


    /*
    Fotoğraf modundan çık
    */

    photoMode =
      false;

    uploadedImage.style.display =
      "none";

    video.style.display =
      "block";


    /*
    Eski kamera varsa kapat
    */

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    /*
    Kamera
    */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              "user",

            width: {

              ideal:
                1280

            },

            height: {

              ideal:
                720

            }

          },

          audio:
            false

        });


    video.srcObject =
      stream;


    await video.play();


    running =
      true;


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;

    cameraModeBtn.disabled =
      true;


    setState(
      "Kamera",
      true,
      "Kamera çalışıyor"
    );


    status.textContent =
      "🟢 Kamera açık\n\n" +
      "AI yüz arıyor...";

    status.className =
      "status success";


    frameCount =
      0;

    lastFpsTime =
      performance.now();


    cameraLoop();


  }

  catch (error) {

    console.error(
      error
    );


    setState(
      "Kamera",
      false,
      error.message ||
      String(error)
    );


    showError(
      "Kamera açılamadı:\n\n" +
      (
        error.message ||
        String(error)
      )
    );

  }

}


/* =====================================================
   KAMERA DÖNGÜSÜ
===================================================== */

async function cameraLoop() {

  if (!running || photoMode) {
    return;
  }


  if (
    video.readyState >= 2 &&
    faceDetection
  ) {

    try {

      await faceDetection.send({

        image:
          video

      });

    }

    catch (error) {

      console.error(
        error
      );

    }

  }


  animationFrame =
    requestAnimationFrame(
      cameraLoop
    );

}


/* =====================================================
   KAMERA DURDUR
===================================================== */

function stopCamera() {

  running =
    false;


  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  faceCount.textContent =
    "0";

  fpsElement.textContent =
    "0";

  confidenceElement.textContent =
    "0%";

  positionElement.textContent =
    "—";


  faceInfo.classList.remove(
    "visible"
  );


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  status.textContent =
    "⏸️ Kamera durduruldu.";

}


/* =====================================================
   FOTOĞRAF SEÇ
===================================================== */

photoInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    /*
    Kamera kapat
    */

    stopCamera();


    /*
    Eski URL
    */

    if (photoURL) {

      URL.revokeObjectURL(
        photoURL
      );

    }


    /*
    Yeni URL
    */

    photoURL =
      URL.createObjectURL(
        file
      );


    uploadedImage.src =
      photoURL;


    uploadedImage.onload =
      async function() {

        photoMode =
          true;

        running =
          false;


        /*
        Görüntü
        */

        video.style.display =
          "none";

        uploadedImage.style.display =
          "block";


        /*
        Canvas
        */

        canvas.width =
          uploadedImage.naturalWidth;

        canvas.height =
          uploadedImage.naturalHeight;


        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        /*
        Buton
        */

        cameraModeBtn.disabled =
          false;


        /*
        Durum
        */

        status.textContent =
          "🖼️ Fotoğraf analiz ediliyor...\n\n" +
          "AI yüz arıyor...";

        status.className =
          "status";


        try {


          await faceDetection.send({

            image:
              uploadedImage

          });


        }

        catch (error) {

          console.error(
            error
          );


          showError(
            "Fotoğraf analiz edilemedi:\n\n" +
            (
              error.message ||
              String(error)
            )
          );

        }

      };

  }
);


/* =====================================================
   SONUÇLAR
===================================================== */

function onResults(
  results
) {

  /*
  Kamera veya fotoğraf
  */

  if (
    !running &&
    !photoMode
  ) {

    return;

  }


  /*
  Canvas boyutu
  */

  if (photoMode) {

    canvas.width =
      uploadedImage.naturalWidth;

    canvas.height =
      uploadedImage.naturalHeight;

  }

  else {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;

  }


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const detections =
    results.detections ||
    [];


  /*
  Yüz sayısı
  */

  faceCount.textContent =
    detections.length;


  /*
  Yüz listesi
  */

  faceList.innerHTML =
    "";


  if (
    detections.length
  ) {

    faceInfo.classList.add(
      "visible"
    );

  }

  else {

    faceInfo.classList.remove(
      "visible"
    );

  }


  let highestConfidence =
    0;


  /*
  Her yüz
  */

  detections.forEach(
    function(
      detection,
      index
    ) {


      const box =
        detection.boundingBox;


      if (!box) {
        return;
      }


      /*
      Güven
      */

      let confidence =
        0;


      if (
        detection.score &&
        detection.score.length
      ) {

        confidence =
          detection.score[0];

      }


      highestConfidence =
        Math.max(
          highestConfidence,
          confidence
        );


      /*
      Kutu
      */

      const x =
        box.xCenter -
        box.width / 2;

      const y =
        box.yCenter -
        box.height / 2;

      const width =
        box.width;

      const height =
        box.height;


      ctx.strokeStyle =
        "#00ff88";

      ctx.lineWidth =
        Math.max(
          3,
          canvas.width / 300
        );


      ctx.strokeRect(
        x,
        y,
        width,
        height
      );


      /*
      Merkez
      */

      const centerX =
        Math.round(
          box.xCenter
        );

      const centerY =
        Math.round(
          box.yCenter
        );


      /*
      Etiket
      */

      ctx.fillStyle =
        "#00ff88";

      ctx.font =
        "bold 18px Arial";


      ctx.fillText(

        "YÜZ " +
        (index + 1),

        x,

        Math.max(
          24,
          y - 8
        )

      );


      /*
      Landmark noktaları
      */

      if (
        detection.landmarks
      ) {

        detection.landmarks
          .forEach(
            function(point) {

              const px =
                point.x *
                canvas.width;

              const py =
                point.y *
                canvas.height;


              ctx.beginPath();


              ctx.arc(
                px,
                py,
                4,
                0,
                Math.PI * 2
              );


              ctx.fillStyle =
                "#00eaff";


              ctx.fill();

            }
          );

      }


      /*
      Yüz bilgi kartı
      */

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "faceItem";


      item.innerHTML =
        `
        <strong>
          👤 Yüz ${index + 1}
        </strong>
        <br>
        📊 Güven:
        ${Math.round(
          confidence * 100
        )}%
        <br>
        📍 Konum:
        ${centerX},
        ${centerY}
        `;


      faceList.appendChild(
        item
      );


    }
  );


  /*
  Genel güven
  */

  confidenceElement.textContent =
    detections.length
      ? Math.round(
          highestConfidence * 100
        ) + "%"
      : "0%";


  /*
  İlk yüzün konumu
  */

  if (
    detections[0] &&
    detections[0].boundingBox
  ) {

    const first =
      detections[0].boundingBox;


    positionElement.textContent =
      Math.round(
        first.xCenter
      ) +
      ", " +
      Math.round(
        first.yCenter
      );

  }

  else {

    positionElement.textContent =
      "—";

  }


  /*
  FPS
  */

  frameCount++;


  const now =
    performance.now();


  const elapsed =
    now -
    lastFpsTime;


  if (
    elapsed >= 1000
  ) {

    fpsElement.textContent =
      Math.round(
        frameCount /
        (elapsed / 1000)
      );


    frameCount =
      0;


    lastFpsTime =
      now;

  }


  /*
  Durum
  */

  if (
    photoMode
  ) {

    if (
      detections.length
    ) {

      status.textContent =
        "🟢 Fotoğraf analiz edildi.\n\n" +
        detections.length +
        " yüz algılandı.";

      status.className =
        "status success";

    }

    else {

      status.textContent =
        "🔍 Fotoğraf analiz edildi.\n\n" +
        "Yüz bulunamadı.";

      status.className =
        "status";

    }

  }

}


/* =====================================================
   KAMERAYA GERİ DÖN
===================================================== */

cameraModeBtn.addEventListener(
  "click",
  function() {


    photoMode =
      false;


    uploadedImage.style.display =
      "none";


    video.style.display =
      "block";


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    faceCount.textContent =
      "0";

    fpsElement.textContent =
      "0";

    confidenceElement.textContent =
      "0%";

    positionElement.textContent =
      "—";


    faceInfo.classList.remove(
      "visible"
    );


    cameraModeBtn.disabled =
      true;


    status.textContent =
      "📷 Kamera moduna dönüldü.\n\n" +
      "Kamerayı başlatabilirsin.";


    status.className =
      "status";


    startBtn.disabled =
      false;


  }
);


/* =====================================================
   BAŞLAT
===================================================== */

initializeAI();

</script>
