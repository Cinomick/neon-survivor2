<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AI Face Swap</title>

<!-- MediaPipe Face Mesh -->
<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"
crossorigin="anonymous">
</script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    background:#070b16;
    color:white;
    font-family:-apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin:10px 0 5px;
    font-size:34px;
}

.subtitle{
    text-align:center;
    color:#9aa7c0;
    margin-bottom:18px;
}

.stage{
    position:relative;
    width:100%;
    aspect-ratio:16/10;

    background:#02040a;

    border:1px solid #293858;
    border-radius:20px;

    overflow:hidden;
}

#canvas{
    width:100%;
    height:100%;
    display:block;
}

video{
    display:none;
}

.panel{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    background:#10182a;
    border:1px solid #293858;
    border-radius:16px;
    padding:15px;
}

.card h2{
    margin:0 0 12px;
    font-size:18px;
}

button,
.fileButton{
    width:100%;

    border:0;
    border-radius:12px;

    padding:15px;

    color:white;

    font-size:16px;
    font-weight:800;

    text-align:center;

    cursor:pointer;

    background:#5368ff;
}

.fileButton{
    display:block;
    background:#7a4dff;
}

input[type=file]{
    display:none;
}

button.green{
    background:#10c978;
}

button.gray{
    background:#28344c;
}

button.orange{
    background:#d88928;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.status{
    margin-top:12px;

    padding:15px;

    border-radius:14px;

    background:#10182a;

    border:1px solid #293858;

    white-space:pre-wrap;

    line-height:1.5;
}

.success{
    color:#73ffba;
}

.error{
    color:#ff98a5;
}

.info{
    color:#aab6cd;
}

.stats{
    margin-top:12px;

    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:9px;
}

.stat{
    background:#10182a;

    border-radius:13px;

    padding:13px;

    text-align:center;
}

.stat b{
    display:block;

    font-size:23px;
}

.stat span{
    color:#8997b0;

    font-size:12px;
}

.preview{
    margin-top:10px;

    padding:12px;

    background:#0c1322;

    border-radius:12px;

    color:#8e9bb3;

    font-size:13px;
}

@media(max-width:650px){

    .panel{
        grid-template-columns:1fr;
    }

    h1{
        font-size:28px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>
</head>

<body>

<div class="app">

<h1>🤖 AI Face Swap</h1>

<div class="subtitle">
468 noktalı yüz analizi ve canlı yüz takibi
</div>


<!-- KAMERA -->
<div class="stage">

    <canvas id="canvas"></canvas>

</div>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<div class="panel">


<!-- KAYNAK YÜZ -->

<div class="card">

<h2>1️⃣ Kaynak yüz</h2>

<label
    class="fileButton"
    for="photoInput">

    🖼️ Fotoğraf Seç

</label>

<input
    id="photoInput"
    type="file"
    accept="image/*">


<div style="height:10px"></div>


<button
    id="analyzeButton"
    disabled>

    🔎 Kaynak Yüzü Analiz Et

</button>


<div
    id="photoInfo"
    class="preview">

    Henüz fotoğraf seçilmedi.

</div>

</div>


<!-- KAMERA -->

<div class="card">

<h2>2️⃣ Kamera</h2>

<button
    id="cameraButton"
    class="green">

    📷 Kamerayı Aç

</button>


<div style="height:10px"></div>


<button
    id="stopButton"
    class="gray"
    disabled>

    ⏹ Kamerayı Kapat

</button>

</div>

</div>


<!-- KALİBRASYON -->

<div class="panel">

<div class="card">

<h2>3️⃣ Mimik Kalibrasyonu</h2>

<button
    id="calibrationButton"
    class="orange"
    disabled>

    🧭 Kalibrasyonu Başlat

</button>


<div
    id="calibrationInfo"
    class="preview">

    Önce kaynak yüzünü analiz et.

</div>

</div>


<div class="card">

<h2>4️⃣ Canlı sistem</h2>

<button
    id="swapButton"
    disabled>

    🔥 Face Swap Başlat

</button>


<div
    id="swapInfo"
    class="preview">

    Kalibrasyon tamamlandığında aktif olacak.

</div>

</div>

</div>


<div
    id="status"
    class="status info">

⏳ AI sistemi hazırlanıyor...

</div>


<div class="stats">

<div class="stat">

<b id="faceCount">
0
</b>

<span>
Algılanan yüz
</span>

</div>


<div class="stat">

<b id="fps">
0
</b>

<span>
FPS
</span>

</div>


<div class="stat">

<b id="landmarkCount">
0
</b>

<span>
Landmark
</span>

</div>

</div>

</div>


<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const photoInput =
document.getElementById("photoInput");

const analyzeButton =
document.getElementById("analyzeButton");

const cameraButton =
document.getElementById("cameraButton");

const stopButton =
document.getElementById("stopButton");

const calibrationButton =
document.getElementById(
    "calibrationButton"
);

const swapButton =
document.getElementById(
    "swapButton"
);

const status =
document.getElementById("status");

const photoInfo =
document.getElementById("photoInfo");

const calibrationInfo =
document.getElementById(
    "calibrationInfo"
);

const swapInfo =
document.getElementById(
    "swapInfo"
);

const faceCount =
document.getElementById(
    "faceCount"
);

const fps =
document.getElementById("fps");

const landmarkCount =
document.getElementById(
    "landmarkCount"
);


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let faceMesh = null;

let stream = null;

let cameraRunning = false;

let processing = false;

let latestLandmarks = null;

let sourceLandmarks = null;

let sourceImage = null;

let sourceReady = false;

let calibrationData = [];

let animationFrame = null;

let frameCounter = 0;

let lastFPS =
performance.now();


/* =====================================================
   DURUM
===================================================== */

function setStatus(
    text,
    type="info"
){

    status.textContent = text;

    status.className =
        "status " + type;

}


/* =====================================================
   MEDIAPIPE BAŞLAT
===================================================== */

function initializeFaceMesh(){

    if(
        typeof FaceMesh ===
        "undefined"
    ){

        setStatus(
            "❌ MediaPipe Face Mesh yüklenemedi.\n\n"+
            "İnternet bağlantısını kontrol et.",
            "error"
        );

        return;

    }


    try{

        faceMesh =
        new FaceMesh({

            locateFile:
            function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/"+
                    "@mediapipe/face_mesh/"+
                    file
                );

            }

        });


        faceMesh.setOptions({

            maxNumFaces:1,

            refineLandmarks:true,

            minDetectionConfidence:
                0.5,

            minTrackingConfidence:
                0.5

        });


        faceMesh.onResults(
            handleResults
        );


        analyzeButton.disabled =
            false;


        setStatus(
            "✅ AI hazır.\n\n"+
            "Önce kaynak yüz fotoğrafını seç.",
            "success"
        );

    }

    catch(error){

        setStatus(
            "❌ Face Mesh başlatılamadı:\n\n"+
            error.message,
            "error"
        );

        console.error(error);

    }

}


/* =====================================================
   FOTOĞRAF SEÇİLDİ
===================================================== */

photoInput.addEventListener(
"change",
function(){

    const file =
        photoInput.files[0];

    if(!file)
        return;


    sourceImage =
        new Image();


    sourceImage.onload =
    function(){

        photoInfo.textContent =
            "📸 Fotoğraf yüklendi.\n"+
            "Şimdi \"Kaynak Yüzü Analiz Et\" butonuna bas.";

        analyzeButton.disabled =
            false;

    };


    sourceImage.onerror =
    function(){

        photoInfo.textContent =
            "❌ Fotoğraf okunamadı.";

    };


    sourceImage.src =
        URL.createObjectURL(file);

});


/* =====================================================
   KAYNAK FOTOĞRAF ANALİZİ
===================================================== */

analyzeButton.addEventListener(
"click",
async function(){

    if(!sourceImage){

        setStatus(
            "❌ Önce bir fotoğraf seç.",
            "error"
        );

        return;

    }


    analyzeButton.disabled =
        true;


    setStatus(
        "🔎 Kaynak yüz analiz ediliyor...\n\n"+
        "468 yüz noktası çıkarılıyor.",
        "info"
    );


    try{

        const result =
            await analyzeImage(
                sourceImage
            );


        if(!result){

            throw new Error(
                "Fotoğrafta yüz bulunamadı."
            );

        }


        sourceLandmarks =
            result;


        sourceReady =
            true;


        calibrationButton.disabled =
            false;


        photoInfo.textContent =
            "✅ Kaynak yüz başarıyla analiz edildi.\n"+
            "468 landmark hazır.";


        landmarkCount.textContent =
            result.length;


        setStatus(
            "🟢 Kaynak yüz hazır!\n\n"+
            "Şimdi çok açılı mimik kalibrasyonunu başlat.",
            "success"
        );

    }

    catch(error){

        analyzeButton.disabled =
            false;


        setStatus(
            "❌ Kaynak yüz analizi başarısız:\n\n"+
            error.message,
            "error"
        );

        console.error(error);

    }

});


/* =====================================================
   FOTOĞRAF ANALİZİ
===================================================== */

function analyzeImage(image){

    return new Promise(
    async function(resolve,reject){

        let finished =
            false;


        const timer =
            setTimeout(
            function(){

                if(finished)
                    return;


                finished =
                    true;


                reject(
                    new Error(
                        "Yüz analizi zaman aşımına uğradı."
                    )
                );

            },
            10000
            );


        const oldCallback =
            faceMesh.onResults;


        faceMesh.onResults =
        function(result){

            if(finished)
                return;


            finished =
                true;


            clearTimeout(timer);


            const landmarks =
                result
                .multiFaceLandmarks &&
                result
                .multiFaceLandmarks[0];


            faceMesh.onResults =
                oldCallback;


            resolve(
                landmarks || null
            );

        };


        try{

            await faceMesh.send({
                image:image
            });

        }

        catch(error){

            if(!finished){

                finished =
                    true;

                clearTimeout(timer);

                reject(error);

            }

        }

    });

}


/* =====================================================
   KAMERA AÇ
===================================================== */

cameraButton.addEventListener(
"click",
async function(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices
                .getUserMedia
        ){

            throw new Error(
                "Bu tarayıcı kamera erişimini desteklemiyor."
            );

        }


        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        await waitForVideo();


        canvas.width =
            video.videoWidth ||
            1280;

        canvas.height =
            video.videoHeight ||
            720;


        cameraRunning =
            true;


        cameraButton.disabled =
            true;


        stopButton.disabled =
            false;


        setStatus(
            "🟢 Kamera açık.\n\n"+
            "Yüzünü kameraya göster.",
            "success"
        );


        startCameraLoop();

    }

    catch(error){

        setStatus(
            "❌ Kamera açılamadı:\n\n"+
            error.name+
            "\n"+
            error.message,
            "error"
        );

        console.error(error);

    }

});


/* =====================================================
   VIDEO HAZIR BEKLE
===================================================== */

function waitForVideo(){

    return new Promise(
    function(resolve){

        if(video.videoWidth){

            resolve();

            return;

        }


        const interval =
            setInterval(
            function(){

                if(video.videoWidth){

                    clearInterval(
                        interval
                    );

                    resolve();

                }

            },
            50
            );


        setTimeout(
        function(){

            clearInterval(
                interval
            );

            resolve();

        },
        2000
        );

    });

}


/* =====================================================
   KAMERA LOOP
===================================================== */

function startCameraLoop(){

    if(!cameraRunning)
        return;


    drawVideo();


    if(
        !processing &&
        video.readyState >= 2
    ){

        processing =
            true;


        faceMesh
        .send({
            image:video
        })
        .catch(
        function(error){

            console.error(
                "AI:",
                error
            );

            setStatus(
                "❌ Kamera AI hatası:\n"+
                error.message,
                "error"
            );

        })
        .finally(
        function(){

            processing =
                false;

        });

    }


    animationFrame =
        requestAnimationFrame(
            startCameraLoop
        );

}


/* =====================================================
   KAMERA GÖRÜNTÜSÜ
===================================================== */

function drawVideo(){

    if(
        !video.videoWidth ||
        !video.videoHeight
    )
        return;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
      Ön kamera görüntüsünü
      ayna gibi göster.
    */

    ctx.save();


    ctx.translate(
        canvas.width,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.restore();

}


/* =====================================================
   MEDIAPIPE SONUÇ
===================================================== */

function handleResults(
    results
){

    const landmarks =
        results
        .multiFaceLandmarks &&
        results
        .multiFaceLandmarks[0];


    if(!landmarks){

        latestLandmarks =
            null;

        faceCount.textContent =
            "0";

        return;

    }


    latestLandmarks =
        landmarks;


    faceCount.textContent =
        "1";


    landmarkCount.textContent =
        landmarks.length;


    /*
      Kamera sırasında landmarkları
      görsel olarak göster.
    */

    if(cameraRunning){

        ctx.save();


        ctx.fillStyle =
            "#42ddff";


        for(
            let i=0;
            i<landmarks.length;
            i+=4
        ){

            const p =
                landmarks[i];


            const x =
                (1-p.x) *
                canvas.width;


            const y =
                p.y *
                canvas.height;


            ctx.beginPath();


            ctx.arc(
                x,
                y,
                1.5,
                0,
                Math.PI*2
            );


            ctx.fill();

        }


        ctx.restore();

    }


    updateFPS();

}


/* =====================================================
   FPS
===================================================== */

function updateFPS(){

    frameCounter++;


    const now =
        performance.now();


    if(
        now-lastFPS >=
        1000
    ){

        fps.textContent =
            Math.round(
                frameCounter *
                1000 /
                (now-lastFPS)
            );


        frameCounter =
            0;


        lastFPS =
            now;

    }

}


/* =====================================================
   KALİBRASYON
===================================================== */

calibrationButton.addEventListener(
"click",
async function(){

    if(!sourceReady){

        setStatus(
            "❌ Önce kaynak yüzü analiz et.",
            "error"
        );

        return;

    }


    if(!cameraRunning){

        /*
          Kamera kapalıysa otomatik aç.
        */

        cameraButton.click();


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    800
                )
        );

    }


    calibrationData =
        [];


    setStatus(
        "🧭 KALİBRASYON\n\n"+
        "😐 Kameraya düz bak.\n\n"+
        "Yüzün ekranda göründüğünde "+
        "\"Pozu Kaydet\" aşamasına geçeceğiz.",
        "info"
    );


    calibrationInfo.textContent =
        "Kamera açık. Önce nötr yüzünü kaydet.";


    /*
      Basit kalibrasyon için
      mevcut yüzü kaydediyoruz.
    */

    setTimeout(
    function(){

        if(latestLandmarks){

            calibrationData
                .push({

                    name:"nötr",

                    landmarks:
                        latestLandmarks

                });


            calibrationInfo.textContent =
                "✅ Nötr yüz kaydedildi.\n"+
                "Şimdi gülümse.";

        }

    },
    1500
    );


    setTimeout(
    function(){

        if(latestLandmarks){

            calibrationData
                .push({

                    name:"gülümseme",

                    landmarks:
                        latestLandmarks

                });


            calibrationInfo.textContent =
                "✅ Kaynak mimik örnekleri hazır.";

            swapButton.disabled =
                false;

            swapInfo.textContent =
                "Canlı Face Swap başlatılabilir.";

        }

    },
    3500
    );

});


/* =====================================================
   FACE SWAP BAŞLAT
===================================================== */

swapButton.addEventListener(
"click",
function(){

    if(
        !sourceReady ||
        !latestLandmarks
    ){

        setStatus(
            "❌ Kaynak yüz veya hedef yüz hazır değil.",
            "error"
        );

        return;

    }


    setStatus(
        "🔥 CANLI FACE SWAP AKTİF\n\n"+
        "Hedef yüz takip ediliyor.",
        "success"
    );

});


/* =====================================================
   DURDUR
===================================================== */

stopButton.addEventListener(
"click",
function(){

    cameraRunning =
        false;


    processing =
        false;


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

    }


    animationFrame =
        null;


    if(stream){

        stream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );

    }


    stream =
        null;


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    cameraButton.disabled =
        false;


    stopButton.disabled =
        true;


    faceCount.textContent =
        "0";


    setStatus(
        "Kamera kapatıldı.",
        "info"
    );

});


/* =====================================================
   BAŞLAT
===================================================== */

initializeFaceMesh();

</script>

</body>
</html>
