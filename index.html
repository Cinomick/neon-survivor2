<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Survivor 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:#eefaff;font-family:system-ui,-apple-system,Arial,sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:10px}.panel{background:#06111dcc;border:1px solid #66dfff55;border-radius:11px;padding:8px 11px;backdrop-filter:blur(5px)}.stats{display:flex;gap:10px}.meter{width:125px;height:8px;background:#12212d;border-radius:8px;overflow:hidden;margin-top:4px}.fill{height:100%;width:100%}.hp{background:#ff5577}.xp{background:#4edbff}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;z-index:30}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 8px #59e5ff}.crossv{position:absolute;width:2px;height:22px;left:10px;top:0;background:#fff}.crossh{position:absolute;width:22px;height:2px;left:0;top:10px;background:#fff}#boss{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;min-width:260px;text-align:center}.bossbar{height:10px;background:#241a0d;border-radius:8px;overflow:hidden}.bossfill{height:100%;background:#ffb84d}#status{position:absolute;left:10px;bottom:10px;font-size:12px;max-width:80vw}#center,#error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto}.box{width:min(600px,90vw);padding:25px;border-radius:18px;background:#03101bea;border:1px solid #61dfff55;box-shadow:0 0 50px #00bfff12}.title{font-size:clamp(36px,10vw,60px);margin:0 0 4px;text-shadow:0 0 25px #51ddff}.sub{opacity:.78;margin:0 0 18px}button{border:0;border-radius:11px;padding:14px 28px;background:#55dcff;color:#04101a;font-weight:900;font-size:16px;touch-action:manipulation}#error{display:none;z-index:500;background:#02060bf2}.err{color:#ffb6c4}.small{font-size:12px;opacity:.7;margin-top:12px;word-break:break-word}#pause,#upgrade{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#02070dcc;pointer-events:auto;z-index:200}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(900px,92vw)}.card{padding:16px;border-radius:13px;border:1px solid #5ee0ff55;background:#091927;cursor:pointer;min-height:130px}.enemyBar{position:fixed;width:58px;height:6px;background:#000b;border:1px solid #fff8;border-radius:4px;transform:translate(-50%,-50%);z-index:40;pointer-events:none}.enemyBarFill{height:100%;width:100%;background:#ff4669}.enemyBarBoss{width:88px;height:8px}.enemyBarBoss .enemyBarFill{background:#ffb84d}#mobileControls{display:none;position:fixed;inset:0;z-index:100;pointer-events:none;touch-action:none}.mobileBtn{position:absolute;width:68px;height:68px;border-radius:50%;pointer-events:auto;border:2px solid #96ebff66;background:#0a2334aa;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}.stick{left:20px;bottom:28px;width:92px;height:92px;border-radius:50%;background:#0a233488;border:2px solid #78e7ff55}.knob{position:absolute;width:40px;height:40px;border-radius:50%;left:24px;top:24px;background:#57dcff55;border:2px solid #b8f5ff66}.fire{right:18px;bottom:28px;background:#ff4c6d44}.run{right:95px;bottom:28px;width:54px;height:54px;font-size:11px}.pauseBtn{right:14px;top:65px;width:46px;height:46px;font-size:11px}
@media(pointer:coarse) and (max-width:900px){#mobileControls{display:block}.top{font-size:11px}.panel{padding:7px 9px}.meter{width:95px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="ui">
 <div class="top"><div class="panel"><b>NEON SURVIVOR</b><div class="stats"><span>CAN <span id="hpTxt">100</span></span><span>LV <span id="lvTxt">1</span></span><span>SKOR <span id="scoreTxt">0</span></span></div><div class="meter"><div id="hpFill" class="fill hp"></div></div><div class="meter"><div id="xpFill" class="fill xp"></div></div></div><div class="panel">Dalga <b id="waveTxt">1</b> · <span id="enemyTxt">0</span>/15</div></div>
 <div id="boss" class="panel"><b id="bossName">BOSS</b><div class="bossbar"><div id="bossFill" class="bossfill"></div></div><small id="bossPower"></small></div>
 <div id="cross"><i class="crossh"></i><i class="crossv"></i></div><div id="status"></div>
</div>
<div id="center"><div class="box"><h1 class="title">NEON SURVIVOR</h1><p class="sub">3D arena · mobil ve bilgisayar destekli</p><button id="startBtn" type="button">OYUNA BAŞLA</button><div id="loadText" class="small">Başlamak için butona bas.</div></div></div>
<div id="error"><div class="box"><h2>Oyun başlatılamadı</h2><p id="errorText" class="err"></p><button id="retryBtn" type="button">TEKRAR DENE</button><div class="small">Hata ekranda görünür; buton artık sessizce takılmaz.</div></div></div>
<div id="pause"><div class="box"><h2>DURAKLATILDI</h2><button id="resumeBtn">DEVAM ET</button></div></div>
<div id="upgrade"><div class="box"><h2>SEVİYE ATLADIN</h2><div class="cards" id="cards"></div></div></div>
<div id="mobileControls"><div id="stick" class="mobileBtn stick"><div id="knob" class="knob"></div></div><div id="run" class="mobileBtn run">KOŞ</div><div id="fire" class="mobileBtn fire">ATEŞ</div><div id="pauseBtn" class="mobileBtn pauseBtn">II</div></div>
<script>
/* IMPORTANT: this script runs before Three.js exists. The Start button can never be blocked by a top-level THREE error. */
(function(){
 const $=id=>document.getElementById(id); let started=false, loading=false;
 const sources=[
  'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js',
  'https://unpkg.com/three@0.180.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r180/three.min.js'
 ];
 function setLoad(t){$('loadText').textContent=t}
 function showError(e){$('errorText').textContent=String(e&&e.message?e.message:e);$('error').style.display='flex';$('center').style.display='none'}
 function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>resolve();s.onerror=()=>reject(new Error('CDN yüklenemedi: '+src));document.head.appendChild(s)})}
 async function ensureThree(){if(window.THREE)return;let last=null;for(let i=0;i<sources.length;i++){setLoad('3D motor yükleniyor… '+(i+1)+'/3');try{await Promise.race([loadScript(sources[i]),new Promise((_,rej)=>setTimeout(()=>rej(new Error('yükleme zaman aşımı')),9000))]);if(window.THREE)return;last=new Error('Three.js yüklendi fakat global THREE oluşmadı.')}catch(e){last=e}}throw last||new Error('Three.js yüklenemedi')}
 async function begin(){if(started||loading)return;loading=true;$('startBtn').disabled=true;setLoad('Hazırlanıyor…');$('error').style.display='none';try{await ensureThree();setLoad('3D sahne hazırlanıyor…');window.__neonStartGame()}catch(e){console.error(e);showError(e);$('startBtn').disabled=false}finally{loading=false}}
 $('startBtn').addEventListener('click',begin); $('startBtn').addEventListener('touchend',e=>{e.preventDefault();begin()},{passive:false}); $('retryBtn').addEventListener('click',begin);
 window.__neonStartReady=function(){started=true;$('center').style.display='none'};
})();
</script>
<script>
/* Engine is isolated: nothing here runs until Three.js has successfully loaded and __neonStartGame is called. */
window.__neonStartGame=function(){
 const $=id=>document.getElementById(id); const T=window.THREE;
 if(!T)throw new Error('3D motoru bulunamadı.');
 const root=$('game'); root.innerHTML='';
 let scene,camera,renderer,clock,player,gun,aimYaw=0,aimPitch=-.25,running=true,paused=false,health=100,xp=0,level=1,score=0,wave=1,spawnTimer=0,spawnCount=0,boss=null,playerSpeed=5,attackCooldown=0,enemyTimer=0;
 const enemies=[],pulses=[],particles=[],keys={};
 try{
  scene=new T.Scene();scene.background=new T.Color(0x02060b);scene.fog=new T.Fog(0x02060b,18,55);
  camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.05,100);camera.position.set(0,4,7);
  renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;root.appendChild(renderer.domElement);
  clock=new T.Clock();
  scene.add(new T.HemisphereLight(0x9eefff,0x101020,1.5));const dl=new T.DirectionalLight(0xffffff,1.3);dl.position.set(5,10,4);scene.add(dl);
  const floor=new T.Mesh(new T.CylinderGeometry(24,24,.35,48),new T.MeshStandardMaterial({color:0x08151d,metalness:.4,roughness:.7}));floor.position.y=-.18;scene.add(floor);
  const ring=new T.Mesh(new T.TorusGeometry(18,.08,8,96),new T.MeshBasicMaterial({color:0x38dfff}));ring.rotation.x=Math.PI/2;ring.position.y=.02;scene.add(ring);
  for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r=12+(i%4)*2.2;const h=1.2+(i%5)*.5;const m=new T.Mesh(new T.BoxGeometry(.55,h,.55),new T.MeshStandardMaterial({color:i%2?0x102b39:0x18303a,emissive:i%2?0x062a38:0x08151d,emissiveIntensity:1.2}));m.position.set(Math.cos(a)*r,h/2-.05,Math.sin(a)*r);scene.add(m)}
  player=new T.Group();const body=new T.Mesh(new T.CapsuleGeometry(.38,.8,6,12),new T.MeshStandardMaterial({color:0x4de3ff,emissive:0x063e50,emissiveIntensity:1.8}));body.position.y=.8;player.add(body);const visor=new T.Mesh(new T.BoxGeometry(.48,.18,.12),new T.MeshBasicMaterial({color:0xd9fbff}));visor.position.set(0,1.05,-.34);player.add(visor);scene.add(player);
  gun=new T.Mesh(new T.BoxGeometry(.12,.12,.55),new T.MeshStandardMaterial({color:0xbfefff,emissive:0x24b8ff,emissiveIntensity:2}));gun.position.set(.42,.82,-.5);player.add(gun);
  const keydown=e=>{keys[e.code]=true;if(e.code==='KeyP'&&running){paused=!paused;$('pause').style.display=paused?'flex':'none'}};const keyup=e=>keys[e.code]=false;document.addEventListener('keydown',keydown);document.addEventListener('keyup',keyup);
  renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0&&!paused)attack()});
  renderer.domElement.addEventListener('mousemove',e=>{if(e.buttons===1&&!paused){aimYaw-=e.movementX*.002;aimPitch=T.MathUtils.clamp(aimPitch-e.movementY*.0015,-1,0.45)}});
  let touchLook=null;document.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX>innerWidth*.38&&t.target.closest&&t.target.closest('#game'))touchLook={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:false});document.addEventListener('touchmove',e=>{if(!touchLook)return;const t=[...e.changedTouches].find(x=>x.identifier===touchLook.id);if(!t)return;aimYaw-=(t.clientX-touchLook.x)*.006;aimPitch=T.MathUtils.clamp(aimPitch-(t.clientY-touchLook.y)*.004,-1,0.45);touchLook.x=t.clientX;touchLook.y=t.clientY;e.preventDefault()},{passive:false});document.addEventListener('touchend',e=>{if([...e.changedTouches].some(t=>t.identifier===touchLook?.id))touchLook=null},{passive:false});
  $('resumeBtn').onclick=()=>{paused=false;$('pause').style.display='none'};
  const mobile={x:0,y:0,run:false,fire:false,id:null};const stick=$('stick'),knob=$('knob');function stickPos(x,y){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=28;let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}mobile.x=dx/max;mobile.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}function resetStick(){mobile.x=mobile.y=0;knob.style.transform='translate(0,0)'}
  stick.ontouchstart=e=>{const t=e.changedTouches[0];mobile.id=t.identifier;stickPos(t.clientX,t.clientY);e.preventDefault()};stick.ontouchmove=e=>{const t=[...e.changedTouches].find(x=>x.identifier===mobile.id);if(t){stickPos(t.clientX,t.clientY);e.preventDefault()}};stick.ontouchend=()=>{mobile.id=null;resetStick()};$('run').ontouchstart=e=>{mobile.run=true;e.preventDefault()};$('run').ontouchend=e=>{mobile.run=false;e.preventDefault()};$('fire').ontouchstart=e=>{mobile.fire=true;attack();e.preventDefault()};$('fire').ontouchend=e=>{mobile.fire=false;e.preventDefault()};$('pauseBtn').ontouchstart=e=>{paused=!paused;$('pause').style.display=paused?'flex':'none';e.preventDefault()};
  function makeEnemy(bossType=false){const g=new T.Group();const mat=new T.MeshStandardMaterial({color:bossType?0xffb84d:0xff4168,emissive:bossType?0x5a2500:0x4d0012,emissiveIntensity:2});const mesh=new T.Mesh(new T.IcosahedronGeometry(bossType?1.05:.48,1),mat);mesh.position.y=bossType?1.05:.48;g.add(mesh);const e={g,hp:bossType?80:10,max:bossType?80:10,speed:bossType?1.2:1.8,boss:bossType,dead:false};g.position.set((Math.random()-.5)*32,0,(Math.random()-.5)*32);scene.add(g);enemies.push(e);return e}
  function spawn(){if(enemies.filter(e=>!e.dead&&!e.boss).length>=15)return;if(boss===null&&score>0&&score%30===0){boss=makeEnemy(true);$('bossName').textContent=['VOID REAPER','NEON TITAN','PLASMA WARDEN'][Math.floor(Math.random()*3)];$('bossPower').textContent=['VOID DASH','SHOCKWAVE','PLASMA BURST'][Math.floor(Math.random()*3)];$('boss').style.display='block';for(const e of enemies){if(!e.boss)e.hp=0}return}makeEnemy(false)}
  function attack(){if(!running||paused||attackCooldown>0)return;attackCooldown=.22;const dir=new T.Vector3(0,0,-1).applyEuler(new T.Euler(aimPitch,aimYaw,0,'YXZ')).normalize();const m=new T.Mesh(new T.SphereGeometry(.1,8,8),new T.MeshBasicMaterial({color:0x6be9ff}));m.position.copy(player.position).add(new T.Vector3(0,1,-.5));scene.add(m);pulses.push({m,dir,life:1.2})}
  function hit(e,dmg){e.hp-=dmg;if(e.hp<=0){e.dead=true;score+=e.boss?30:1;xp+=e.boss?25:3;if(e.boss){boss=null;$('boss').style.display='none'}for(let i=0;i<8;i++){const p=new T.Mesh(new T.SphereGeometry(.045,6,6),new T.MeshBasicMaterial({color:0x72eaff,transparent:true}));p.position.copy(e.g.position);scene.add(p);particles.push({m:p,v:new T.Vector3((Math.random()-.5)*3,Math.random()*3,(Math.random()-.5)*3),life:.6})}scene.remove(e.g)}}
  function update(dt){if(paused)return;attackCooldown=Math.max(0,attackCooldown-dt);spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.25,1.1-wave*.025)}wave=1+Math.floor(score/20);if(xp>=100){xp-=100;level++;$('upgrade').style.display='flex';paused=true;const arr=[['HIZ','Hareket hızını artır'],['GÜÇ','Enerji darbesi hasarı +3'],['CAN','Can +20']];$('cards').innerHTML='';arr.forEach(([a,b],i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<b>'+a+'</b><br><br>'+b;c.onclick=()=>{if(i===0)playerSpeed+=1;if(i===1)damageBonus+=3;if(i===2)health=Math.min(100,health+20);$('upgrade').style.display='none';paused=false};$('cards').appendChild(c)})}
   const forward=new T.Vector3(0,0,-1).applyAxisAngle(new T.Vector3(0,1,0),aimYaw);const right=new T.Vector3(1,0,0).applyAxisAngle(new T.Vector3(0,1,0),aimYaw);let mv=new T.Vector3();mv.addScaledVector(forward,(keys.KeyW?-1:0)+(keys.KeyS?1:0));mv.addScaledVector(right,(keys.KeyD?1:0)+(keys.KeyA?-1:0));if(Math.abs(mv.x)+Math.abs(mv.z)>0){mv.normalize();player.position.addScaledVector(mv,dt*playerSpeed*((keys.ShiftLeft||mobileRun())?1.65:1))}
   for(const e of enemies){if(e.dead)continue;const v=player.position.clone().sub(e.g.position);v.y=0;const d=v.length();if(d>1.25){v.normalize();e.g.position.addScaledVector(v,dt*e.speed)}else health-=dt*(e.boss?8:3);e.g.lookAt(player.position.x,e.g.position.y,player.position.z)}
   for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.m.position.addScaledVector(p.dir,dt*20);p.life-=dt;for(const e of enemies){if(e.dead)continue;if(p.m.position.distanceTo(e.g.position)<(e.boss?1.3:.8)){hit(e,5+(damageBonus||0));p.life=0;break}}if(p.life<=0){scene.remove(p.m);pulses.splice(i,1)}}
   for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.m.position.addScaledVector(p.v,dt);p.v.y-=5*dt;p.life-=dt;p.m.material.opacity=Math.max(0,p.life/.6);if(p.life<=0){scene.remove(p.m);particles.splice(i,1)}}
   if(health<=0){health=0;running=false;$('status').textContent='Oyun bitti — yeniden yüklemek için sayfayı yenile.'}
   player.rotation.y=aimYaw;camera.position.lerp(new T.Vector3(player.position.x-Math.sin(aimYaw)*7,player.position.y+3.7,player.position.z-Math.cos(aimYaw)*7),.12);camera.lookAt(player.position.x,player.position.y+1,player.position.z);updateUI()
  }
  let damageBonus=0;function mobileRun(){return $('run').matches&&false}
  function updateUI(){$('hpTxt').textContent=Math.ceil(health);$('lvTxt').textContent=level;$('scoreTxt').textContent=score;$('waveTxt').textContent=wave;$('enemyTxt').textContent=enemies.filter(e=>!e.dead&&!e.boss).length;$('hpFill').style.width=Math.max(0,health)+'%';$('xpFill').style.width=Math.min(100,xp)+'%';if(boss){$('bossFill').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}}
  function loop(){requestAnimationFrame(loop);const dt=Math.min(.035,clock.getDelta());if(mobile.fire)attack();update(dt);renderer.render(scene,camera)}
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  window.__neonStartReady();loop();
 }catch(e){console.error(e);throw e}
};
</script>
</body>
</html>
