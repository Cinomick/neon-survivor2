<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>AI Yüz Algılama</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.1/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.1/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4/face_detection.js" crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  min-height:100vh;
  background:#080b14;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.app{
  width:min(900px,100%);
  margin:auto;
  text-align:center
}

h1{
  margin:0 0 8px;
  font-size:32px
}

.subtitle{
  color:#9faac3;
  margin-bottom:22px
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  background:#02040a;
  border:1px solid #29334d;
  border-radius:18px;
  overflow:hidden
}

video,
#uploadedImage,
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%
}

video{
  object-fit:cover;
  transform:scaleX(-1)
}

#uploadedImage{
  display:none;
  object-fit:contain;
  background:#02040a
}

canvas{
  pointer-events:none;
  transform:scaleX(-1)
}

.status{
  margin-top:14px;
  padding:16px;
  background:#151b2c;
  border-radius:14px;
  text-align:left;
  white-space:pre-wrap;
  line-height:1.6
}

.success{color:#9dffca}
.error{color:#ff9b9b}

.buttons{
  display:flex;
  gap:10px;
  margin-top:14px
}

button,
.photoLabel{
  flex:1;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#5365ff;
  text-align:center;
  cursor:pointer
}

button.secondary{
  background:#252d42
}

.photoLabel{
  display:block;
  background:#7c4dff
}

button:disabled{
  opacity:.4;
  cursor:not-allowed
}

#photoInput{
  display:none
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:14px
}

.stat{
  background:#11182a;
  border-radius:14px;
  padding:16px
}

.stat b{
  display:block;
  font-size:25px;
  margin-bottom:5px
}

.stat span{
  color:#9faac3
}

.diagnostics{
  margin-top:14px;
  padding:16px;
  background:#0e1422;
  border:1px solid #202a40;
  border-radius:14px;
  text-align:left
}

.diagnostics h2{
  margin:0 0 10px;
  font-size:18px
}

pre{
  margin:0;
  white-space:pre-wrap;
  color:#cdd6ec;
  font-family:monospace;
  font-size:13px;
  line-height:1.7
}

.faceInfo{
  display:none;
  margin-top:14px;
  padding:16px;
  background:#10182b;
  border-radius:14px;
  text-align:left
}

.faceInfo.visible{
  display:block
}

.faceInfo h2{
  margin:0 0 10px;
  font-size:18px
}

.faceItem{
  padding:10px 0;
  border-bottom:1px solid #26314a
}

@media(max-width:600px){
  h1{font-size:27px}
  .buttons{flex-direction:column}
}
</style>
</head>

<body>

<div class="app">

<h1>🤖 AI Yüz Algılama</h1>

<div class="subtitle">
Gerçek zamanlı yüz algılama sistemi
</div>

<div class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <img
    id="uploadedImage"
    alt="Yüklenen fotoğraf">

  <canvas id="canvas"></canvas>

</div>

<div id="status" class="status">
⏳ AI sistemi hazırlanıyor...
</div>

<div class="buttons">

  <button id="startBtn" disabled>
    📷 Kamerayı Başlat
  </button>

  <button id="stopBtn" class="secondary" disabled>
    ⏹ Kamerayı Durdur
  </button>

</div>

<div class="buttons">

  <label for="photoInput" class="photoLabel">
    🖼️ Fotoğraf Seç
  </label>

  <button id="cameraModeBtn" class="secondary" disabled>
    📷 Kameraya Dön
  </button>

</div>

<input
  id="photoInput"
  type="file"
  accept="image/*">

<div class="stats">

  <div class="stat">
    <b id="faceCount">0</b>
    <span>Yüz</span>
  </div>

  <div class="stat">
    <b id="fps">0</b>
    <span>FPS</span>
  </div>

  <div class="stat">
    <b id="confidence">0%</b>
    <span>Güven</span>
  </div>

  <div class="stat">
    <b id="position">—</b>
    <span>Konum</span>
  </div>

</div>

<div id="faceInfo" class="faceInfo">
  <h2>👤 Algılanan Yüzler</h2>
  <div id="faceList"></div>
</div>

<div class="diagnostics">

<h2>🔧 Sistem Durumu</h2>

<pre id="diagnostics">Başlatılıyor...</pre>

</div>

</div>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const uploadedImage =
document.getElementById("uploadedImage");

const status =
document.getElementById("status");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const cameraModeBtn =
document.getElementById("cameraModeBtn");

const photoInput =
document.getElementById("photoInput");

const faceCount =
document.getElementById("faceCount");

const fpsElement =
document.getElementById("fps");

const confidenceElement =
document.getElementById("confidence");

const positionElement =
document.getElementById("position");

const diagnostics =
document.getElementById("diagnostics");

const faceInfo =
document.getElementById("faceInfo");

const faceList =
document.getElementById("faceList");


let faceDetection = null;
let camera = null;
let stream = null;

let running = false;
let photoMode = false;
let photoURL = null;

let frameCount = 0;
let lastFpsTime = performance.now();


const states = {};


function setState(name, success, message){

  states[name] = {
    success,
    message
  };

  diagnostics.textContent =
    Object.entries(states)
    .map(([name,item]) =>
      (item.success ? "✅ " : "❌ ") +
      name +
      " — " +
      item.message
    )
    .join("\n");
}


function showError(message){

  status.textContent =
    "❌ HATA\n\n" +
    message;

  status.className =
    "status error";
}


/* =====================================================
   MEDIAPIPE
===================================================== */

function initializeAI(){

  try{

    if(
      typeof FaceDetection ===
      "undefined"
    ){

      throw new Error(
        "FaceDetection kütüphanesi yüklenemedi."
      );

    }

    if(
      typeof Camera ===
      "undefined"
    ){

      throw new Error(
        "MediaPipe Camera kütüphanesi yüklenemedi."
      );

    }

    setState(
      "MediaPipe",
      true,
      "Kütüphaneler yüklendi"
    );


    faceDetection =
      new FaceDetection({

        locateFile:function(file){

          return (
            "https://cdn.jsdelivr.net/npm/" +
            "@mediapipe/face_detection@0.4/" +
            file
          );

        }

      });


    faceDetection.setOptions({

      model:"short",

      selfieMode:true,

      minDetectionConfidence:0.5

    });


    faceDetection.onResults(
      onResults
    );


    setState(
      "Yüz modeli",
      true,
      "BlazeFace hazır"
    );


    status.textContent =
      "✅ AI sistemi hazır!\n\n" +
      "Kamerayı başlatabilir veya " +
      "fotoğraf seçebilirsin.";

    status.className =
      "status success";


    startBtn.disabled =
      false;

  }

  catch(error){

    console.error(
      "AI:",
      error
    );

    setState(
      "AI sistemi",
      false,
      error.message
    );

    showError(
      "AI başlatılamadı:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   KAMERA
===================================================== */

async function startCamera(){

  try{

    photoMode = false;

    uploadedImage.style.display =
      "none";

    video.style.display =
      "block";


    if(stream){

      stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    }


    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    running =
      true;


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;

    cameraModeBtn.disabled =
      true;


    setState(
      "Kamera",
      true,
      "Kamera çalışıyor"
    );


    status.textContent =
      "🟢 Kamera açık\n\n" +
      "AI yüz arıyor...";

    status.className =
      "status success";


    frameCount = 0;

    lastFpsTime =
      performance.now();


    /*
      MediaPipe'ın resmi Camera
      yardımcı sınıfını kullanıyoruz.
    */

    camera =
      new Camera(
        video,
        {

          onFrame:
          async function(){

            if(
              running &&
              !photoMode
            ){

              await faceDetection.send({
                image:video
              });

            }

          },

          width:1280,
          height:720

        }
      );


    camera.start();

  }

  catch(error){

    console.error(
      "KAMERA:",
      error
    );

    setState(
      "Kamera",
      false,
      error.message
    );

    showError(
      "Kamera açılamadı:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   KAMERA DURDUR
===================================================== */

function stopCamera(){

  running =
    false;


  if(camera){

    try{
      camera.stop();
    }
    catch(e){}

    camera =
      null;

  }


  if(stream){

    stream
    .getTracks()
    .forEach(
      track => track.stop()
    );

  }


  stream =
    null;

  video.srcObject =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  faceCount.textContent =
    "0";

  fpsElement.textContent =
    "0";

  confidenceElement.textContent =
    "0%";

  positionElement.textContent =
    "—";


  faceInfo.classList.remove(
    "visible"
  );


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;

}


/* =====================================================
   FOTOĞRAF
===================================================== */

photoInput.addEventListener(
"change",
function(event){

  const file =
    event.target.files[0];

  if(!file)
    return;


  stopCamera();


  if(photoURL){

    URL.revokeObjectURL(
      photoURL
    );

  }


  photoURL =
    URL.createObjectURL(file);


  uploadedImage.onload =
  async function(){

    photoMode =
      true;

    running =
      false;


    video.style.display =
      "none";

    uploadedImage.style.display =
      "block";


    cameraModeBtn.disabled =
      false;


    canvas.width =
      uploadedImage.naturalWidth;

    canvas.height =
      uploadedImage.naturalHeight;


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    status.textContent =
      "🖼️ Fotoğraf analiz ediliyor...";


    try{

      await faceDetection.send({
        image:uploadedImage
      });

    }

    catch(error){

      showError(
        "Fotoğraf analiz edilemedi:\n\n" +
        error.message
      );

    }

  };


  uploadedImage.src =
    photoURL;

});


/* =====================================================
   SONUÇ
===================================================== */

function onResults(results){

  if(
    !running &&
    !photoMode
  ){

    return;

  }


  const image =
    photoMode
      ? uploadedImage
      : video;


  canvas.width =
    photoMode
      ? uploadedImage.naturalWidth
      : video.videoWidth;

  canvas.height =
    photoMode
      ? uploadedImage.naturalHeight
      : video.videoHeight;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Fotoğrafın kendisini canvas'a
    çiziyoruz.
  */

  if(photoMode){

    ctx.save();

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(
      -1,
      1
    );

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.restore();

  }


  const detections =
    results.detections || [];


  faceCount.textContent =
    detections.length;


  faceList.innerHTML =
    "";


  if(detections.length){

    faceInfo.classList.add(
      "visible"
    );

  }
  else{

    faceInfo.classList.remove(
      "visible"
    );

  }


  let highest =
    0;


  detections.forEach(
  function(detection,index){

    const box =
      detection.boundingBox;


    if(!box)
      return;


    const confidence =
      detection.score &&
      detection.score.length
        ? detection.score[0]
        : 0;


    highest =
      Math.max(
        highest,
        confidence
      );


    /*
      MediaPipe koordinatları
    */

    const x =
      box.xCenter -
      box.width / 2;

    const y =
      box.yCenter -
      box.height / 2;


    /*
      Fotoğraf modunda canvas
      aynalandığı için koordinatı
      ters çeviriyoruz.
    */

    const drawX =
      photoMode
        ? canvas.width -
          x -
          box.width
        : x;


    /*
      Kutu
    */

    ctx.strokeStyle =
      "#00ff88";

    ctx.lineWidth =
      4;


    ctx.strokeRect(
      drawX,
      y,
      box.width,
      box.height
    );


    /*
      Landmarklar
    */

    if(
      detection.landmarks
    ){

      detection.landmarks
      .forEach(
      function(point){

        const px =
          point.x *
          canvas.width;

        const py =
          point.y *
          canvas.height;


        const drawPX =
          photoMode
            ? canvas.width - px
            : px;


        ctx.beginPath();

        ctx.arc(
          drawPX,
          py,
          4,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          "#00eaff";

        ctx.fill();

      });

    }


    /*
      Etiket
    */

    ctx.fillStyle =
      "#00ff88";

    ctx.font =
      "bold 18px Arial";


    ctx.fillText(
      "YÜZ " +
      (index + 1),
      drawX,
      Math.max(
        24,
        y - 8
      )
    );


    /*
      Merkez
    */

    const centerX =
      Math.round(
        box.xCenter *
        canvas.width
      );

    const centerY =
      Math.round(
        box.yCenter *
        canvas.height
      );


    /*
      Bilgi kartı
    */

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "faceItem";


    item.innerHTML =
      `
      <strong>👤 Yüz ${index + 1}</strong>
      <br>
      📊 Güven:
      ${Math.round(
        confidence * 100
      )}%
      <br>
      📍 Konum:
      ${centerX}, ${centerY}
      `;


    faceList.appendChild(
      item
    );

  });


  confidenceElement.textContent =
    detections.length
      ? Math.round(
          highest * 100
        ) + "%"
      : "0%";


  if(
    detections[0] &&
    detections[0].boundingBox
  ){

    const first =
      detections[0].boundingBox;


    positionElement.textContent =
      Math.round(
        first.xCenter *
        canvas.width
      ) +
      ", " +
      Math.round(
        first.yCenter *
        canvas.height
      );

  }
  else{

    positionElement.textContent =
      "—";

  }


  /*
    FPS sadece kamerada
  */

  if(!photoMode){

    frameCount++;

    const now =
      performance.now();

    const elapsed =
      now -
      lastFpsTime;


    if(elapsed >= 1000){

      fpsElement.textContent =
        Math.round(
          frameCount /
          (elapsed / 1000)
        );


      frameCount =
        0;

      lastFpsTime =
        now;

    }

  }


  if(photoMode){

    status.textContent =
      detections.length

      ? "🟢 Fotoğraf analiz edildi.\n\n" +
        detections.length +
        " yüz algılandı."

      : "🔍 Fotoğraf analiz edildi.\n\n" +
        "Yüz bulunamadı.";

    status.className =
      detections.length
        ? "status success"
        : "status";

  }

}


/* =====================================================
   KAMERAYA DÖN
===================================================== */

cameraModeBtn.addEventListener(
"click",
function(){

  photoMode =
    false;


  uploadedImage.style.display =
    "none";

  video.style.display =
    "block";


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  faceCount.textContent =
    "0";

  confidenceElement.textContent =
    "0%";

  positionElement.textContent =
    "—";


  faceInfo.classList.remove(
    "visible"
  );


  cameraModeBtn.disabled =
    true;


  status.textContent =
    "📷 Kamera moduna dönüldü.\n\n" +
    "Kamerayı başlatabilirsin.";

  status.className =
    "status";


  startBtn.disabled =
    false;

});


/* =====================================================
   BUTONLAR
===================================================== */

startBtn.addEventListener(
  "click",
  startCamera
);

stopBtn.addEventListener(
  "click",
  stopCamera
);


/* =====================================================
   BAŞLAT
===================================================== */

setState(
  "HTTPS",
  location.protocol === "https:",
  location.protocol === "https:"
    ? "Güvenli bağlantı"
    : "HTTPS gerekli"
);


setState(
  "Kamera API",
  !!(
    navigator.mediaDevices &&
    navigator.mediaDevices.getUserMedia
  ),
  navigator.mediaDevices
    ? "Tarayıcı destekliyor"
    : "Kamera API bulunamadı"
);


initializeAI();

</script>

</body>
</html>
