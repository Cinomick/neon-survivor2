<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Neon AI Face Swap</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#080b12;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(1000px,94%);
    margin:auto;
    padding:22px 0;
}

h1{
    margin:0 0 8px;
    font-size:28px;
}

.subtitle{
    color:#9ba4b5;
    margin-bottom:20px;
}

.panel{
    background:#111722;
    border:1px solid #252e3e;
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input[type=file],
input[type=text]{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #30394a;
    background:#0b1018;
    color:white;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    margin-top:12px;
    cursor:pointer;
    font-weight:bold;
    background:#6c5ce7;
    color:white;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#status{
    margin-top:12px;
    color:#aeb8c9;
}

.video-wrap{
    position:relative;
    width:100%;
    max-width:720px;
    margin:auto;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    aspect-ratio:16/9;
}

video,
canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

video{
    visibility:hidden;
}

canvas{
    background:#000;
}

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
}

.stat{
    background:#0b1018;
    border:1px solid #252e3e;
    border-radius:10px;
    padding:9px 12px;
    color:#b9c2d2;
}

.warning{
    color:#ffcf70;
    font-size:14px;
    line-height:1.5;
}

.ok{
    color:#6ee7a1;
}

.error{
    color:#ff7777;
}
</style>
</head>

<body>

<div class="container">

<h1>🪄 Neon AI Face Swap</h1>

<div class="subtitle">
Gerçek zamanlı AI yüz değiştirme prototipi
</div>

<div class="panel">

<label>1. Kaynak yüz fotoğrafı</label>

<input
    id="sourceInput"
    type="file"
    accept="image/*"
>

<button id="loadSource">
    Kaynak yüzü yükle
</button>

<div id="sourceStatus"></div>

</div>

<div class="panel">

<label>2. AI sunucu adresi</label>

<input
    id="serverUrl"
    type="text"
    placeholder="wss://sunucu-adresin/ws"
>

<button id="connect">
    AI sunucusuna bağlan
</button>

<button id="start" disabled>
    🪄 AI Face Swap'ı Başlat
</button>

<div id="status">
    Sunucu bağlantısı bekleniyor...
</div>

</div>

<div class="panel">

<div class="video-wrap">
    <video id="video"
           autoplay
           playsinline
           muted></video>

    <canvas id="canvas"></canvas>
</div>

<div class="stats">

<div class="stat">
AI FPS:
<span id="fps">0</span>
</div>

<div class="stat">
Gecikme:
<span id="latency">0</span> ms
</div>

<div class="stat">
Durum:
<span id="state">Bekliyor</span>
</div>

</div>

</div>

<div class="panel warning">

⚠️ Bu sistem yalnızca izinli kişilerin görüntüleriyle kullanılmalıdır.
Gerçek kişileri izinsiz taklit etmek veya insanları yanıltmak için kullanma.

</div>

</div>

<script>

const sourceInput =
    document.getElementById("sourceInput");

const loadSource =
    document.getElementById("loadSource");

const connectButton =
    document.getElementById("connect");

const startButton =
    document.getElementById("start");

const serverUrl =
    document.getElementById("serverUrl");

const sourceStatus =
    document.getElementById("sourceStatus");

const statusText =
    document.getElementById("status");

const stateText =
    document.getElementById("state");

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const fpsText =
    document.getElementById("fps");

const latencyText =
    document.getElementById("latency");

let socket = null;
let sourceData = null;
let swapping = false;
let busy = false;

let frameCount = 0;
let lastFpsTime = performance.now();

serverUrl.value =
    localStorage.getItem("neon_ai_server") || "";

function setStatus(text, type=""){
    statusText.textContent = text;
    statusText.className = type;
}

function setState(text){
    stateText.textContent = text;
}

loadSource.addEventListener("click", async ()=>{

    const file = sourceInput.files[0];

    if(!file){
        sourceStatus.textContent =
            "Önce bir fotoğraf seç.";
        sourceStatus.className = "error";
        return;
    }

    if(!file.type.startsWith("image/")){
        sourceStatus.textContent =
            "Geçerli bir resim seç.";
        return;
    }

    try{

        const reader = new FileReader();

        reader.onload = ()=>{
            sourceData = reader.result;

            sourceStatus.textContent =
                "✅ Kaynak yüz hazır.";

            sourceStatus.className = "ok";

            if(socket &&
               socket.readyState === WebSocket.OPEN){

                sendSource();
            }
        };

        reader.onerror = ()=>{
            sourceStatus.textContent =
                "Fotoğraf okunamadı.";
        };

        reader.readAsDataURL(file);

    }catch(err){

        sourceStatus.textContent =
            "Hata: " + err.message;
    }

});

function sendSource(){

    if(!socket ||
       socket.readyState !== WebSocket.OPEN ||
       !sourceData){

        return;
    }

    socket.send(JSON.stringify({
        type:"source",
        image:sourceData
    }));

    setStatus(
        "Kaynak yüz AI modeline gönderiliyor..."
    );
}

connectButton.addEventListener("click", ()=>{

    let url =
        serverUrl.value.trim();

    if(!url){

        setStatus(
            "WebSocket sunucu adresini gir.",
            "error"
        );

        return;
    }

    localStorage.setItem(
        "neon_ai_server",
        url
    );

    if(socket){
        socket.close();
    }

    setStatus("AI sunucusuna bağlanılıyor...");
    setState("Bağlanıyor");

    try{

        socket = new WebSocket(url);

    }catch(err){

        setStatus(
            "Bağlantı oluşturulamadı: "+err.message,
            "error"
        );

        return;
    }

    socket.onopen = ()=>{

        setStatus(
            "✅ AI sunucusuna bağlandı.",
            "ok"
        );

        setState("Bağlı");

        startButton.disabled = false;

        if(sourceData){
            sendSource();
        }
    };

    socket.onmessage = event => {

        try{

            const data =
                JSON.parse(event.data);

            if(data.type === "ready"){

                setStatus(
                    "AI modeli hazır.",
                    "ok"
                );

            }

            else if(data.type === "source-ready"){

                setStatus(
                    "✅ Kaynak yüz AI tarafından algılandı.",
                    "ok"
                );

                startButton.disabled = false;
            }

            else if(data.type === "frame"){

                drawResult(data.image);

                busy = false;

                frameCount++;

                const now =
                    performance.now();

                if(now-lastFpsTime >= 1000){

                    fpsText.textContent =
                        frameCount;

                    frameCount = 0;
                    lastFpsTime = now;
                }

            }

            else if(data.type === "error"){

                busy = false;

                setStatus(
                    "AI: "+data.message,
                    "error"
                );
            }

        }catch(err){

            busy = false;

            console.error(err);
        }
    };

    socket.onerror = ()=>{

        setStatus(
            "AI sunucusu bağlantı hatası.",
            "error"
        );

        setState("Hata");
    };

    socket.onclose = ()=>{

        busy = false;

        setState("Bağlantı kapalı");

        startButton.disabled = true;

        if(swapping){
            swapping = false;
            startButton.textContent =
                "🪄 AI Face Swap'ı Başlat";
        }
    };

});

startButton.addEventListener("click",
async ()=>{

    if(!sourceData){

        setStatus(
            "Önce kaynak yüz fotoğrafını yükle.",
            "error"
        );

        return;
    }

    if(!socket ||
       socket.readyState !== WebSocket.OPEN){

        setStatus(
            "Önce AI sunucusuna bağlan.",
            "error"
        );

        return;
    }

    if(!swapping){

        try{

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        video:{
                            facingMode:"user",
                            width:{ideal:1280},
                            height:{ideal:720}
                        },
                        audio:false
                    });

            video.srcObject = stream;

            await video.play();

            canvas.width =
                video.videoWidth || 640;

            canvas.height =
                video.videoHeight || 480;

            swapping = true;

            startButton.textContent =
                "⛔ AI Face Swap'ı Durdur";

            setState("AI aktif");
            setStatus(
                "Kamera başlatıldı. AI işliyor...",
                "ok"
            );

            requestAnimationFrame(loop);

        }catch(err){

            setStatus(
                "Kamera açılamadı: "+err.message,
                "error"
            );
        }

    }else{

        stopCamera();

    }

});

function stopCamera(){

    swapping = false;

    if(video.srcObject){

        video.srcObject
            .getTracks()
            .forEach(track=>track.stop());

        video.srcObject = null;
    }

    busy = false;

    startButton.textContent =
        "🪄 AI Face Swap'ı Başlat";

    setState("Bekliyor");

    setStatus(
        "AI Face Swap durduruldu."
    );
}

function loop(){

    if(!swapping){
        return;
    }

    if(video.readyState >= 2 &&
       !busy &&
       socket &&
       socket.readyState === WebSocket.OPEN){

        sendFrame();
    }

    setTimeout(
        ()=>requestAnimationFrame(loop),
        70
    );
}

function sendFrame(){

    if(video.videoWidth <= 0 ||
       video.videoHeight <= 0){

        return;
    }

    const maxWidth = 640;

    const scale =
        Math.min(
            1,
            maxWidth / video.videoWidth
        );

    const width =
        Math.round(
            video.videoWidth * scale
        );

    const height =
        Math.round(
            video.videoHeight * scale
        );

    const temp =
        document.createElement("canvas");

    temp.width = width;
    temp.height = height;

    const tempCtx =
        temp.getContext("2d");

    tempCtx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    const image =
        temp.toDataURL(
            "image/jpeg",
            0.72
        );

    busy = true;

    const started =
        performance.now();

    socket.send(JSON.stringify({
        type:"frame",
        image:image
    }));

    latencyText.textContent =
        Math.round(
            performance.now()-started
        );
}

function drawResult(dataUrl){

    const image =
        new Image();

    image.onload = ()=>{

        canvas.width =
            image.width;

        canvas.height =
            image.height;

        ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
        );
    };

    image.src = dataUrl;
}

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>
</html>
