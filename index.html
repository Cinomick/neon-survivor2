<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Neon Face Swap</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js"
          crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #17233d 0%, #080b13 55%, #05070c 100%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: min(100%, 900px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .subtitle {
      color: #aeb8cc;
      margin-bottom: 18px;
    }

    .panel {
      background: rgba(15, 20, 32, .92);
      border: 1px solid #27344f;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #34425e;
      background: #0b101b;
      color: white;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px 15px;
      margin-top: 10px;
      background: #1f6feb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    button.secondary {
      background: #263148;
    }

    button.success {
      background: #16875b;
    }

    button.warning {
      background: #a86b15;
    }

    .viewer {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #02040a;
      border: 1px solid #26334d;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    video,
    #sourceImage {
      display: none;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #0b111d;
      border: 1px solid #27344f;
      color: #d9e1f0;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .stat {
      background: #0b111d;
      border: 1px solid #26334d;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 18px;
    }

    .stat span {
      color: #8e9bb3;
      font-size: 12px;
    }

    .calibration {
      display: none;
      margin-top: 12px;
      padding: 13px;
      border-radius: 12px;
      background: #111a2b;
      border: 1px solid #36517d;
    }

    .calibration.active {
      display: block;
    }

    .step {
      margin-top: 5px;
      color: #9fb0ca;
    }

    .error {
      color: #ff8e8e;
    }

    .ok {
      color: #73e6a8;
    }

    .warningText {
      color: #ffd27a;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🧠 Neon Face Swap</h1>
  <div class="subtitle">
    Kaynak yüzünü analiz et → kamerayı aç → mimik kalibrasyonu yap → canlı dene.
  </div>

  <div class="panel">

    <label for="photo">
      1️⃣ Kaynak yüz fotoğrafı
    </label>

    <input
      id="photo"
      type="file"
      accept="image/*"
    >

    <button id="analyze" disabled>
      🔍 Kaynak Yüzü Analiz Et
    </button>

    <div id="photoStatus" class="status">
      Henüz fotoğraf seçilmedi.
    </div>

  </div>

  <div class="panel">

    <label>
      2️⃣ Kamera
    </label>

    <button id="openCamera" class="secondary">
      📷 Kamerayı Aç
    </button>

    <button id="stopCamera" class="secondary" disabled>
      ⛔ Kamerayı Durdur
    </button>

  </div>

  <div class="viewer">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="panel">

    <div class="stats">
      <div class="stat">
        <b id="faceCount">0</b>
        <span>Yüz</span>
      </div>

      <div class="stat">
        <b id="landmarkCount">0</b>
        <span>Landmark</span>
      </div>

      <div class="stat">
        <b id="fps">0</b>
        <span>FPS</span>
      </div>
    </div>

    <button id="calibrate" class="warning" disabled>
      🎯 Mimik Kalibrasyonunu Başlat
    </button>

    <div id="calibration" class="calibration">

      <strong id="calTitle">
        Kalibrasyon
      </strong>

      <div id="calDescription" class="step">
        -
      </div>

      <button id="savePose">
        ✓ Bu Pozu Kaydet
      </button>

    </div>

    <button id="swap" class="success" disabled>
      🪄 Face Swap'ı Başlat
    </button>

    <div id="status" class="status">
      Sistem başlatılıyor...
    </div>

  </div>

</div>

<img id="sourceImage" alt="Kaynak yüz">

<script>

"use strict";

/* =========================================================
   ELEMENTLER
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const photo = document.getElementById("photo");
const sourceImage = document.getElementById("sourceImage");

const analyzeBtn = document.getElementById("analyze");
const openCameraBtn = document.getElementById("openCamera");
const stopCameraBtn = document.getElementById("stopCamera");

const calibrateBtn = document.getElementById("calibrate");
const savePoseBtn = document.getElementById("savePose");
const swapBtn = document.getElementById("swap");

const statusBox = document.getElementById("status");
const photoStatus = document.getElementById("photoStatus");

const calibrationBox = document.getElementById("calibration");
const calTitle = document.getElementById("calTitle");
const calDescription = document.getElementById("calDescription");

const faceCountEl = document.getElementById("faceCount");
const landmarkCountEl = document.getElementById("landmarkCount");
const fpsEl = document.getElementById("fps");


/* =========================================================
   DURUM
========================================================= */

let cameraMesh = null;
let sourceMesh = null;

let stream = null;
let animationFrame = 0;

let busy = false;

let sourceImageLoaded = false;
let sourceLandmarks = null;

let cameraOn = false;
let cameraLandmarks = null;

let calibrationMode = false;
let calibrationIndex = 0;

let calibrationSamples = [];

let swapOn = false;

let lastFpsTime = performance.now();
let fpsFrames = 0;


/* =========================================================
   KALİBRASYON POZLARI
========================================================= */

const CALIBRATION_STEPS = [

  {
    name: "Nötr",
    description:
      "Yüzünü rahat bırak. Ağzın kapalı, kaşların doğal olsun."
  },

  {
    name: "Gülümse",
    description:
      "Doğal bir şekilde gülümse."
  },

  {
    name: "Ağzını Aç",
    description:
      "Ağzını belirgin şekilde aç."
  },

  {
    name: "Kaşlarını Kaldır",
    description:
      "İki kaşını yukarı kaldır."
  },

  {
    name: "Gözlerini Kıs",
    description:
      "İki gözünü hafifçe kıs."
  }

];


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function setStatus(text, type = "") {

  statusBox.className = "status";

  if (type === "error") {
    statusBox.classList.add("error");
  }

  if (type === "ok") {
    statusBox.classList.add("ok");
  }

  if (type === "warning") {
    statusBox.classList.add("warningText");
  }

  statusBox.textContent = text;
}


function cloneLandmarks(landmarks) {

  return landmarks.map(p => ({
    x: p.x,
    y: p.y,
    z: p.z
  }));

}


function distance(a, b) {

  const dx = a.x - b.x;
  const dy = a.y - b.y;

  return Math.sqrt(dx * dx + dy * dy);

}


/* =========================================================
   MEDIAPIPE
========================================================= */

function createFaceMesh() {

  const mesh = new FaceMesh({

    locateFile: file => {

      return
        `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`;

    }

  });

  mesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

  });

  return mesh;
}


/* =========================================================
   BAŞLAT
========================================================= */

async function init() {

  try {

    cameraMesh = createFaceMesh();

    cameraMesh.onResults(results => {

      if (
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0
      ) {

        cameraLandmarks =
          results.multiFaceLandmarks[0];

        faceCountEl.textContent = "1";

        landmarkCountEl.textContent =
          cameraLandmarks.length;

        if (calibrationMode) {

          drawCalibrationPreview(cameraLandmarks);

        }
        else if (swapOn) {

          renderSwap(cameraLandmarks);

        }

      }
      else {

        cameraLandmarks = null;

        faceCountEl.textContent = "0";
        landmarkCountEl.textContent = "0";

      }

    });

    setStatus(
      "Hazır. Önce kaynak yüz fotoğrafını seç.",
      "ok"
    );

  }
  catch (error) {

    console.error(error);

    setStatus(
      "MediaPipe başlatılamadı: " + error.message,
      "error"
    );

  }

}


/* =========================================================
   FOTOĞRAF SEÇİMİ
========================================================= */

photo.addEventListener("change", () => {

  const file = photo.files[0];

  if (!file) {

    sourceImageLoaded = false;
    analyzeBtn.disabled = true;

    photoStatus.textContent =
      "Fotoğraf seçilmedi.";

    return;

  }

  const url = URL.createObjectURL(file);

  sourceImage.onload = () => {

    sourceImageLoaded = true;

    analyzeBtn.disabled = false;

    photoStatus.innerHTML =
      "✅ Fotoğraf yüklendi. Şimdi <b>Kaynak Yüzü Analiz Et</b> butonuna bas.";

  };

  sourceImage.onerror = () => {

    sourceImageLoaded = false;

    analyzeBtn.disabled = true;

    photoStatus.textContent =
      "❌ Fotoğraf yüklenemedi.";

  };

  sourceImage.src = url;

});


/* =========================================================
   STATİK FOTOĞRAF ANALİZİ
========================================================= */

function detectOnce(mesh, image, timeoutMs = 12000) {

  return new Promise(async (resolve, reject) => {

    let finished = false;

    const timeout = setTimeout(() => {

      if (finished) return;

      finished = true;

      reject(
        new Error(
          "Yüz analizi zaman aşımına uğradı."
        )
      );

    }, timeoutMs);


    mesh.onResults(results => {

      if (finished) return;

      if (
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0
      ) {

        finished = true;

        clearTimeout(timeout);

        resolve(
          results.multiFaceLandmarks[0]
        );

      }

    });


    try {

      await mesh.send({
        image: image
      });

    }
    catch (error) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      reject(error);

    }

  });

}


/* =========================================================
   KAYNAK YÜZ ANALİZİ
========================================================= */

analyzeBtn.addEventListener("click", async () => {

  if (!sourceImageLoaded) {

    photoStatus.textContent =
      "Önce bir fotoğraf seç.";

    return;

  }

  analyzeBtn.disabled = true;

  photoStatus.textContent =
    "⏳ Kaynak yüz analiz ediliyor...";

  try {

    sourceMesh = createFaceMesh();

    const landmarks = await detectOnce(
      sourceMesh,
      sourceImage,
      15000
    );

    if (!landmarks) {

      throw new Error(
        "Fotoğrafta yüz bulunamadı."
      );

    }

    sourceLandmarks =
      cloneLandmarks(landmarks);

    photoStatus.innerHTML =
      `✅ Kaynak yüz analiz edildi.
       <br>
       ${sourceLandmarks.length} yüz noktası bulundu.`;

    calibrateBtn.disabled = false;

    setStatus(
      "Kaynak yüz hazır. Kamerayı açıp mimik kalibrasyonuna geçebilirsin.",
      "ok"
    );

  }
  catch (error) {

    console.error(error);

    photoStatus.innerHTML =
      `<span class="error">
        ❌ ${error.message}
      </span>`;

    analyzeBtn.disabled = false;

  }

});


/* =========================================================
   KAMERA
========================================================= */

async function openCamera() {

  if (cameraOn) return;

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "Bu tarayıcı kamera erişimini desteklemiyor."
      );

    }

    stream = await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: "user",

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    });


    video.srcObject = stream;

    await video.play();

    cameraOn = true;

    openCameraBtn.disabled = true;
    stopCameraBtn.disabled = false;

    canvas.width =
      video.videoWidth || 1280;

    canvas.height =
      video.videoHeight || 720;


    setStatus(
      "📷 Kamera açık. Yüzünü kameraya göster.",
      "ok"
    );


    cancelAnimationFrame(animationFrame);

    animationFrame =
      requestAnimationFrame(loop);

  }
  catch (error) {

    console.error(error);

    setStatus(
      "❌ Kamera açılamadı: " + error.message,
      "error"
    );

  }

}


/* =========================================================
   KAMERA DÖNGÜSÜ
========================================================= */

async function loop() {

  if (!cameraOn) return;

  if (video.readyState >= 2) {

    if (!calibrationMode && !swapOn) {

      ctx.save();

      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.restore();

    }

    if (!busy) {

      busy = true;

      try {

        await cameraMesh.send({
          image: video
        });

      }
      catch (error) {

        console.error(
          "Camera MediaPipe error:",
          error
        );

      }

      busy = false;

    }

  }

  updateFPS();

  animationFrame =
    requestAnimationFrame(loop);

}


/* =========================================================
   FPS
========================================================= */

function updateFPS() {

  fpsFrames++;

  const now = performance.now();

  if (now - lastFpsTime >= 1000) {

    fpsEl.textContent =
      fpsFrames;

    fpsFrames = 0;

    lastFpsTime = now;

  }

}


/* =========================================================
   KAMERAYI DURDUR
========================================================= */

function stopCamera() {

  cameraOn = false;

  cancelAnimationFrame(animationFrame);

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;

  }

  video.srcObject = null;

  openCameraBtn.disabled = false;
  stopCameraBtn.disabled = true;

  cameraLandmarks = null;

  faceCountEl.textContent = "0";
  landmarkCountEl.textContent = "0";

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  setStatus(
    "Kamera durduruldu."
  );

}


/* =========================================================
   KAMERA BUTONLARI
========================================================= */

openCameraBtn.addEventListener(
  "click",
  openCamera
);

stopCameraBtn.addEventListener(
  "click",
  stopCamera
);


/* =========================================================
   KALİBRASYON
========================================================= */

calibrateBtn.addEventListener("click", async () => {

  if (!sourceLandmarks) {

    setStatus(
      "Önce kaynak yüzünü analiz et.",
      "warning"
    );

    return;

  }

  if (!cameraOn) {

    await openCamera();

  }

  calibrationMode = true;

  swapOn = false;

  calibrationIndex = 0;

  calibrationSamples = [];

  calibrationBox.classList.add("active");

  calibrateBtn.style.display = "none";

  showCalibrationStep();

});


/* =========================================================
   KALİBRASYON ADIMINI GÖSTER
========================================================= */

function showCalibrationStep() {

  const step =
    CALIBRATION_STEPS[calibrationIndex];

  if (!step) return;

  calTitle.textContent =
    `${calibrationIndex + 1}/${CALIBRATION_STEPS.length} — ${step.name}`;

  calDescription.textContent =
    step.description;

  savePoseBtn.textContent =
    `✓ ${step.name} Pozunu Kaydet`;

}


/* =========================================================
   KALİBRASYON POZU KAYDET
========================================================= */

savePoseBtn.addEventListener("click", () => {

  if (!cameraLandmarks) {

    setStatus(
      "Kamerada yüz bulunamadı. Yüzünü kameraya göster.",
      "warning"
    );

    return;

  }

  const snap =
    document.createElement("canvas");

  snap.width =
    video.videoWidth || 1280;

  snap.height =
    video.videoHeight || 720;

  const snapCtx =
    snap.getContext("2d");

  snapCtx.drawImage(
    video,
    0,
    0,
    snap.width,
    snap.height
  );


  calibrationSamples.push({

    name:
      CALIBRATION_STEPS[calibrationIndex].name,

    landmarks:
      cloneLandmarks(cameraLandmarks),

    image:
      snap,

    metrics:
      calculateExpressionMetrics(
        cameraLandmarks
      )

  });


  calibrationIndex++;


  if (
    calibrationIndex >=
    CALIBRATION_STEPS.length
  ) {

    finishCalibration();

  }
  else {

    showCalibrationStep();

  }

});


/* =========================================================
   KALİBRASYON BİTİR
========================================================= */

function finishCalibration() {

  calibrationMode = false;

  calibrationBox.classList.remove("active");

  calibrateBtn.style.display = "block";

  calibrateBtn.disabled = true;

  swapBtn.disabled = false;

  setStatus(
    "✅ Mimik kalibrasyonu tamamlandı. Artık Face Swap'ı başlatabilirsin.",
    "ok"
  );

}


/* =========================================================
   KALİBRASYON PREVIEW
========================================================= */

function drawCalibrationPreview(landmarks) {

  ctx.save();

  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  ctx.fillStyle = "rgba(0,0,0,.45)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    60
  );


  ctx.fillStyle = "#7ee7ff";

  ctx.font =
    "bold 22px Arial";

  ctx.fillText(
    `${CALIBRATION_STEPS[calibrationIndex]?.name || ""}`,
    20,
    38
  );


  drawLandmarks(
    landmarks,
    "#7ee7ff"
  );

}


/* =========================================================
   LANDMARK ÇİZ
========================================================= */

function drawLandmarks(
  landmarks,
  color = "#00ffff"
) {

  if (!landmarks) return;

  ctx.fillStyle = color;

  for (let i = 0; i < landmarks.length; i += 4) {

    const p = landmarks[i];

    const x =
      (1 - p.x) * canvas.width;

    const y =
      p.y * canvas.height;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1.7,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

}


/* =========================================================
   MİMİK METRİKLERİ
========================================================= */

function calculateExpressionMetrics(lm) {

  if (!lm || lm.length < 468) {

    return {
      mouth: 0,
      smile: 0,
      eyeL: 0,
      eyeR: 0,
      brow: 0
    };

  }


  /*
    MediaPipe Face Mesh landmark noktaları
  */

  const leftEyeTop =
    lm[159];

  const leftEyeBottom =
    lm[145];

  const rightEyeTop =
    lm[386];

  const rightEyeBottom =
    lm[374];


  const leftEyeLeft =
    lm[33];

  const leftEyeRight =
    lm[133];

  const rightEyeLeft =
    lm[362];

  const rightEyeRight =
    lm[263];


  const mouthTop =
    lm[13];

  const mouthBottom =
    lm[14];

  const mouthLeft =
    lm[61];

  const mouthRight =
    lm[291];


  const upperLip =
    lm[0];

  const nose =
    lm[1];


  const leftBrow =
    lm[105];

  const rightBrow =
    lm[334];


  const leftEyeWidth =
    distance(
      leftEyeLeft,
      leftEyeRight
    );

  const rightEyeWidth =
    distance(
      rightEyeLeft,
      rightEyeRight
    );


  const leftEyeHeight =
    distance(
      leftEyeTop,
      leftEyeBottom
    );

  const rightEyeHeight =
    distance(
      rightEyeTop,
      rightEyeBottom
    );


  const mouthWidth =
    distance(
      mouthLeft,
      mouthRight
    );

  const mouthHeight =
    distance(
      mouthTop,
      mouthBottom
    );


  const faceHeight =
    distance(
      lm[10],
      lm[152]
    );


  const mouth =
    mouthHeight /
    Math.max(faceHeight, 0.0001);


  const smile =
    mouthWidth /
    Math.max(faceHeight, 0.0001);


  const eyeL =
    leftEyeHeight /
    Math.max(leftEyeWidth, 0.0001);


  const eyeR =
    rightEyeHeight /
    Math.max(rightEyeWidth, 0.0001);


  const brow =
    (
      distance(
        leftBrow,
        nose
      ) +

      distance(
        rightBrow,
        nose
      )
    ) / 2;


  return {

    mouth,
    smile,
    eyeL,
    eyeR,
    brow

  };

}


/* =========================================================
   EN YAKIN MİMİK
========================================================= */

function findClosestCalibration(
  targetMetrics
) {

  if (!calibrationSamples.length) {
    return null;
  }


  let best = null;

  let bestScore =
    Infinity;


  for (
    const sample
    of calibrationSamples
  ) {

    const m =
      sample.metrics;


    const score =

      Math.abs(
        targetMetrics.mouth -
        m.mouth
      ) * 5

      +

      Math.abs(
        targetMetrics.smile -
        m.smile
      ) * 2

      +

      Math.abs(
        targetMetrics.eyeL -
        m.eyeL
      ) * 2

      +

      Math.abs(
        targetMetrics.eyeR -
        m.eyeR
      ) * 2

      +

      Math.abs(
        targetMetrics.brow -
        m.brow
      );


    if (score < bestScore) {

      bestScore = score;

      best = sample;

    }

  }


  return best;

}


/* =========================================================
   FACE SWAP BUTONU
========================================================= */

swapBtn.addEventListener("click", () => {

  if (!sourceLandmarks) {

    setStatus(
      "Kaynak yüz analiz edilmemiş.",
      "warning"
    );

    return;

  }

  if (!cameraOn) {

    openCamera();

  }


  swapOn = !swapOn;


  if (swapOn) {

    swapBtn.textContent =
      "⛔ Face Swap'ı Durdur";

    setStatus(
      "🪄 Canlı Face Swap aktif.",
      "ok"
    );

  }
  else {

    swapBtn.textContent =
      "🪄 Face Swap'ı Başlat";

    setStatus(
      "Face Swap durduruldu."
    );

  }

});


/* =========================================================
   FACE SWAP
========================================================= */

function renderSwap(targetLandmarks) {

  if (
    !sourceImage ||
    !sourceLandmarks ||
    !targetLandmarks
  ) {
    return;
  }


  /*
    Önce kamerayı çiz.
  */

  ctx.save();

  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  /*
    Hedef mimik analizi.
  */

  const targetMetrics =
    calculateExpressionMetrics(
      targetLandmarks
    );


  const closest =
    findClosestCalibration(
      targetMetrics
    );


  /*
    Kaynak yüzünü hedef yüze
    landmark tabanlı olarak oturt.
  */

  warpSourceFace(
    sourceImage,
    sourceLandmarks,
    targetLandmarks
  );


  if (closest) {

    ctx.fillStyle =
      "rgba(0,0,0,.5)";

    ctx.fillRect(
      10,
      10,
      230,
      42
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 16px Arial";

    ctx.fillText(
      "Mimik: " + closest.name,
      20,
      37
    );

  }

}


/* =========================================================
   SOURCE FACE WARP
========================================================= */

/*
  Burada yüzün tamamını tek bir oval olarak
  yapıştırmak yerine yüz mesh'inin farklı
  bölgelerini üçgenler halinde dönüştürüyoruz.
*/


const TRIANGLES = [

  [10, 338, 297],
  [10, 297, 332],
  [10, 332, 284],

  [10, 284, 251],
  [10, 251, 389],
  [10, 389, 356],

  [10, 356, 454],
  [10, 454, 323],
  [10, 323, 361],

  [10, 361, 288],
  [10, 288, 397],
  [10, 397, 365],

  [10, 365, 379],
  [10, 379, 378],
  [10, 378, 400],

  [10, 400, 377],
  [10, 377, 152],
  [10, 152, 148],

  [10, 148, 176],
  [10, 176, 149],
  [10, 149, 150],

  [10, 150, 136],
  [10, 136, 172],
  [10, 172, 58],

  [10, 58, 132],
  [10, 132, 93],
  [10, 93, 234],

  [10, 234, 127],
  [10, 127, 162],
  [10, 162, 21],

  [10, 21, 54],
  [10, 54, 103],
  [10, 103, 67],

  [10, 67, 109],
  [10, 109, 10]
];


/* =========================================================
   WARP FONKSİYONU
========================================================= */

function warpSourceFace(
  image,
  source,
  target
) {

  /*
    Kaynak fotoğrafın gerçek boyutları
  */

  const sw =
    image.naturalWidth ||
    image.width;

  const sh =
    image.naturalHeight ||
    image.height;


  /*
    Kamera koordinat sistemi.
    Hedef görüntü aynalanmış olduğu için
    X koordinatını ters çeviriyoruz.
  */

  for (
    const triangle
    of TRIANGLES
  ) {

    const a =
      triangle[0];

    const b =
      triangle[1];

    const c =
      triangle[2];


    const s1 =
      source[a];

    const s2 =
      source[b];

    const s3 =
      source[c];


    const t1 =
      target[a];

    const t2 =
      target[b];

    const t3 =
      target[c];


    if (
      !s1 ||
      !s2 ||
      !s3 ||
      !t1 ||
      !t2 ||
      !t3
    ) {
      continue;
    }


    const sx1 =
      s1.x * sw;

    const sy1 =
      s1.y * sh;

    const sx2 =
      s2.x * sw;

    const sy2 =
      s2.y * sh;

    const sx3 =
      s3.x * sw;

    const sy3 =
      s3.y * sh;


    const tx1 =
      (1 - t1.x) *
      canvas.width;

    const ty1 =
      t1.y *
      canvas.height;

    const tx2 =
      (1 - t2.x) *
      canvas.width;

    const ty2 =
      t2.y *
      canvas.height;

    const tx3 =
      (1 - t3.x) *
      canvas.width;

    const ty3 =
      t3.y *
      canvas.height;


    drawTriangle(
      image,

      sx1,
      sy1,
      sx2,
      sy2,
      sx3,
      sy3,

      tx1,
      ty1,
      tx2,
      ty2,
      tx3,
      ty3
    );

  }

}


/* =========================================================
   AFFINE TRIANGLE
========================================================= */

function drawTriangle(
  image,

  sx1,
  sy1,
  sx2,
  sy2,
  sx3,
  sy3,

  dx1,
  dy1,
  dx2,
  dy2,
  dx3,
  dy3
) {

  const denominator =

    sx1 * (
      sy2 - sy3
    )

    +

    sx2 * (
      sy3 - sy1
    )

    +

    sx3 * (
      sy1 - sy2
    );


  if (
    Math.abs(denominator) <
    0.00001
  ) {
    return;
  }


  const a =

    (
      dx1 * (
        sy2 - sy3
      )

      +

      dx2 * (
        sy3 - sy1
      )

      +

      dx3 * (
        sy1 - sy2
      )
    ) / denominator;


  const b =

    (
      dy1 * (
        sy2 - sy3
      )

      +

      dy2 * (
        sy3 - sy1
      )

      +

      dy3 * (
        sy1 - sy2
      )
    ) / denominator;


  const c =

    (
      dx1 * (
        sx3 - sx2
      )

      +

      dx2 * (
        sx1 - sx3
      )

      +

      dx3 * (
        sx2 - sx1
      )
    ) / denominator;


  const d =

    (
      dy1 * (
        sx3 - sx2
      )

      +

      dy2 * (
        sx1 - sx3
      )

      +

      dy3 * (
        sx2 - sx1
      )
    ) / denominator;


  const e =

    (
      dx1 * (
        sx2 * sy3 -
        sx3 * sy2
      )

      +

      dx2 * (
        sx3 * sy1 -
        sx1 * sy3
      )

      +

      dx3 * (
        sx1 * sy2 -
        sx2 * sy1
      )
    ) / denominator;


  const f =

    (
      dy1 * (
        sx2 * sy3 -
        sx3 * sy2
      )

      +

      dy2 * (
        sx3 * sy1 -
        sx1 * sy3
      )

      +

      dy3 * (
        sx1 * sy2 -
        sx2 * sy1
      )
    ) / denominator;


  ctx.save();


  ctx.beginPath();

  ctx.moveTo(
    dx1,
    dy1
  );

  ctx.lineTo(
    dx2,
    dy2
  );

  ctx.lineTo(
    dx3,
    dy3
  );

  ctx.closePath();

  ctx.clip();


  ctx.setTransform(
    a,
    b,
    c,
    d,
    e,
    f
  );


  ctx.drawImage(
    image,
    0,
    0
  );


  ctx.restore();

}


/* =========================================================
   BAŞLAT
========================================================= */

init();

</script>
