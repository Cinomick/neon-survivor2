<body>

<div class="app">

<h1>🧠 Neon Face Swap</h1>

<div class="subtitle">
Kaynak yüzünü analiz et → kamerayı aç → mimik kalibrasyonu yap → canlı dene.
</div>

<div class="panel">

<label>1️⃣ Kaynak yüz fotoğrafı</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

Kalibrasyon

-
</div>

</button>

  id="swap"
  class="success"

🪄 Face Swap'ı Başlat
</button>

Sistem başlatılıyor...
</div>

</div>

</div>


<img id="sourceImage">


<script>

"use strict";


/* =========================================================
   ELEMENTLER
========================================================= */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const photo =
  document.getElementById("photo");

const sourceImage =
  document.getElementById("sourceImage");

const analyzeBtn =
  document.getElementById("analyze");

const openCameraBtn =
  document.getElementById("openCamera");

const stopCameraBtn =
  document.getElementById("stopCamera");

const calibrateBtn =
  document.getElementById("calibrate");

const savePoseBtn =
  document.getElementById("savePose");

const swapBtn =
  document.getElementById("swap");

const statusBox =
  document.getElementById("status");

const photoStatus =
  document.getElementById("photoStatus");

const calibrationBox =
  document.getElementById("calibration");

const calTitle =
  document.getElementById("calTitle");

const calDescription =
  document.getElementById("calDescription");

const faceCountEl =
  document.getElementById("faceCount");

const landmarkCountEl =
  document.getElementById("landmarkCount");

const fpsEl =
  document.getElementById("fps");


/* =========================================================
   STATE
========================================================= */

let cameraMesh = null;
let sourceMesh = null;

let stream = null;
let animationFrame = 0;

let busy = false;

let sourceImageLoaded = false;
let sourceLandmarks = null;

let cameraLandmarks = null;

let cameraOn = false;
let calibrationMode = false;

let calibrationIndex = 0;

let calibrationSamples = [];

let swapOn = false;


/* =========================================================
   FPS
========================================================= */

let fpsFrames = 0;
let lastFpsTime = performance.now();


/* =========================================================
   KALİBRASYON
========================================================= */

const CALIBRATION_STEPS = [

  {
    name: "Nötr",
    description:
      "Yüzünü tamamen rahat bırak. Ağzın kapalı ve kaşların doğal olsun."
  },

  {
    name: "Gülümse",
    description:
      "Doğal şekilde gülümse."
  },

  {
    name: "Ağzını Aç",
    description:
      "Ağzını belirgin şekilde aç."
  },

  {
    name: "Kaşlarını Kaldır",
    description:
      "İki kaşını yukarı kaldır."
  },

  {
    name: "Gözlerini Kıs",
    description:
      "İki gözünü hafifçe kıs."
  }

];


/* =========================================================
   STATUS
========================================================= */

function setStatus(text,type="") {

  statusBox.className = "status";

  if(type === "error")
    statusBox.classList.add("error");

  if(type === "ok")
    statusBox.classList.add("ok");

  if(type === "warning")
    statusBox.classList.add("warningText");

  statusBox.textContent = text;
}


/* =========================================================
   LANDMARK CLONE
========================================================= */

function cloneLandmarks(lm) {

  return lm.map(p => ({
    x:p.x,
    y:p.y,
    z:p.z
  }));

}


/* =========================================================
   MESAFE
========================================================= */

function distance(a,b) {

  const dx = a.x-b.x;
  const dy = a.y-b.y;

  return Math.sqrt(
    dx*dx + dy*dy
  );

}


/* =========================================================
   FACE MESH
========================================================= */

function createFaceMesh() {

  const mesh =
    new FaceMesh({

      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`

    });


  mesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:.5,

    minTrackingConfidence:.5

  });


  return mesh;
}


/* =========================================================
   INIT
========================================================= */

async function init() {

  try {

    cameraMesh =
      createFaceMesh();


    cameraMesh.onResults(results => {

      if(
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length
      ){

        cameraLandmarks =
          results.multiFaceLandmarks[0];

        faceCountEl.textContent = "1";

        landmarkCountEl.textContent =
          cameraLandmarks.length;


        if(calibrationMode){

          drawCalibrationPreview(
            cameraLandmarks
          );

        }
        else if(swapOn){

          renderSwap(
            cameraLandmarks
          );

        }

      }
      else {

        cameraLandmarks = null;

        faceCountEl.textContent = "0";

        landmarkCountEl.textContent = "0";

      }

    });


    setStatus(
      "Hazır. Önce kaynak yüz fotoğrafını seç.",
      "ok"
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      "MediaPipe başlatılamadı: "+error.message,
      "error"
    );

  }

}


/* =========================================================
   FOTOĞRAF
========================================================= */

photo.addEventListener(
  "change",
  () => {

    const file =
      photo.files[0];

    if(!file){

      analyzeBtn.disabled = true;

      sourceImageLoaded = false;

      return;

    }


    const url =
      URL.createObjectURL(file);


    sourceImage.onload = () => {

      sourceImageLoaded = true;

      analyzeBtn.disabled = false;

      photoStatus.textContent =
        "✅ Fotoğraf yüklendi.";

    };


    sourceImage.onerror = () => {

      sourceImageLoaded = false;

      analyzeBtn.disabled = true;

      photoStatus.textContent =
        "❌ Fotoğraf yüklenemedi.";

    };


    sourceImage.src = url;

  }
);


/* =========================================================
   TEK SEFERLİK FACE DETECTION
========================================================= */

function detectOnce(
  mesh,
  image,
  timeoutMs=15000
){

  return new Promise(
    async(resolve,reject)=>{

      let finished = false;

      const timeout =
        setTimeout(
          () => {

            if(finished)
              return;

            finished = true;

            reject(
              new Error(
                "Yüz analizi zaman aşımına uğradı."
              )
            );

          },
          timeoutMs
        );


      mesh.onResults(
        results => {

          if(finished)
            return;


          if(
            results.multiFaceLandmarks &&
            results.multiFaceLandmarks.length
          ){

            finished = true;

            clearTimeout(timeout);

            resolve(
              results.multiFaceLandmarks[0]
            );

          }

        }
      );


      try {

        await mesh.send({
          image:image
        });

      }
      catch(error){

        if(finished)
          return;

        finished = true;

        clearTimeout(timeout);

        reject(error);

      }

    }
  );

}


/* =========================================================
   KAYNAK ANALİZİ
========================================================= */

analyzeBtn.addEventListener(
  "click",
  async()=>{

    if(!sourceImageLoaded)
      return;


    analyzeBtn.disabled = true;

    photoStatus.textContent =
      "⏳ Kaynak yüz analiz ediliyor...";


    try {

      sourceMesh =
        createFaceMesh();


      const lm =
        await detectOnce(
          sourceMesh,
          sourceImage
        );


      if(!lm)
        throw new Error(
          "Fotoğrafta yüz bulunamadı."
        );


      sourceLandmarks =
        cloneLandmarks(lm);


      photoStatus.innerHTML =
        `✅ Kaynak yüz analiz edildi.
        <br>${sourceLandmarks.length} landmark bulundu.`;


      calibrateBtn.disabled = false;


      setStatus(
        "Kaynak yüz hazır. Kamerayı açıp kalibrasyona başlayabilirsin.",
        "ok"
      );

    }
    catch(error){

      console.error(error);

      photoStatus.innerHTML =
        `<span class="error">
        ❌ ${error.message}
        </span>`;

      analyzeBtn.disabled = false;

    }

  }
);


/* =========================================================
   KAMERA
========================================================= */

async function openCamera(){

  if(cameraOn)
    return;


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          facingMode:"user",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    cameraOn = true;


    canvas.width =
      video.videoWidth || 1280;

    canvas.height =
      video.videoHeight || 720;


    openCameraBtn.disabled = true;

    stopCameraBtn.disabled = false;


    setStatus(
      "📷 Kamera açık.",
      "ok"
    );


    animationFrame =
      requestAnimationFrame(loop);

  }
  catch(error){

    console.error(error);

    setStatus(
      "❌ Kamera açılamadı: "+error.message,
      "error"
    );

  }

}


/* =========================================================
   CAMERA LOOP
========================================================= */

async function loop(){

  if(!cameraOn)
    return;


  if(
    video.readyState >= 2 &&
    !busy
  ){

    busy = true;


    try {

      await cameraMesh.send({
        image:video
      });

    }
    catch(error){

      console.error(error);

    }


    busy = false;

  }


  updateFPS();


  animationFrame =
    requestAnimationFrame(loop);

}


/* =========================================================
   FPS
========================================================= */

function updateFPS(){

  fpsFrames++;

  const now =
    performance.now();


  if(now-lastFpsTime >= 1000){

    fpsEl.textContent =
      fpsFrames;

    fpsFrames = 0;

    lastFpsTime = now;

  }

}


/* =========================================================
   KAMERAYI DURDUR
========================================================= */

function stopCamera(){

  cameraOn = false;

  cancelAnimationFrame(
    animationFrame
  );


  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;

  }


  video.srcObject = null;

  openCameraBtn.disabled = false;

  stopCameraBtn.disabled = true;

  cameraLandmarks = null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  setStatus(
    "Kamera durduruldu."
  );

}


openCameraBtn.onclick =
  openCamera;

stopCameraBtn.onclick =
  stopCamera;


/* =========================================================
   KALİBRASYONU BAŞLAT
========================================================= */

calibrateBtn.onclick =
  async()=>{

    if(!sourceLandmarks){

      setStatus(
        "Önce kaynak yüzünü analiz et.",
        "warning"
      );

      return;

    }


    if(!cameraOn)
      await openCamera();


    calibrationMode = true;

    swapOn = false;

    calibrationIndex = 0;

    calibrationSamples = [];


    calibrationBox
      .classList
      .add("active");


    calibrateBtn.style.display =
      "none";


    showCalibrationStep();

  };


/* =========================================================
   KALİBRASYON ADIMI
========================================================= */

function showCalibrationStep(){

  const step =
    CALIBRATION_STEPS[
      calibrationIndex
    ];


  calTitle.textContent =
    `${calibrationIndex+1}/${CALIBRATION_STEPS.length} — ${step.name}`;


  calDescription.textContent =
    step.description;


  savePoseBtn.textContent =
    `✓ ${step.name} Pozunu Kaydet`;

}


/* =========================================================
   KALİBRASYON KAYDET
========================================================= */

savePoseBtn.onclick =
  ()=>{

    if(!cameraLandmarks){

      setStatus(
        "Kamerada yüz bulunamadı.",
        "warning"
      );

      return;

    }


    const snap =
      document.createElement("canvas");


    snap.width =
      video.videoWidth || 1280;

    snap.height =
      video.videoHeight || 720;


    snap
      .getContext("2d")
      .drawImage(
        video,
        0,
        0,
        snap.width,
        snap.height
      );


    calibrationSamples.push({

      name:
        CALIBRATION_STEPS[
          calibrationIndex
        ].name,

      landmarks:
        cloneLandmarks(
          cameraLandmarks
        ),

      image:snap,

      metrics:
        calculateExpressionMetrics(
          cameraLandmarks
        )

    });


    calibrationIndex++;


    if(
      calibrationIndex >=
      CALIBRATION_STEPS.length
    ){

      finishCalibration();

    }
    else{

      showCalibrationStep();

    }

  };


/* =========================================================
   KALİBRASYON BİTİŞ
========================================================= */

function finishCalibration(){

  calibrationMode = false;

  calibrationBox
    .classList
    .remove("active");


  calibrateBtn.style.display =
    "block";

  calibrateBtn.disabled = true;

  swapBtn.disabled = false;


  setStatus(
    "✅ Kalibrasyon tamamlandı. Face Swap'a başlayabilirsin.",
    "ok"
  );

}


/* =========================================================
   KALİBRASYON PREVIEW
========================================================= */

function drawCalibrationPreview(lm){

  ctx.save();

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  drawLandmarks(
    lm
  );

}


/* =========================================================
   LANDMARK PREVIEW
========================================================= */

function drawLandmarks(lm){

  if(!lm)
    return;


  ctx.fillStyle =
    "#7ee7ff";


  for(
    let i=0;
    i<lm.length;
    i+=5
  ){

    const p =
      lm[i];


    const x =
      (1-p.x) *
      canvas.width;


    const y =
      p.y *
      canvas.height;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   MİMİK METRİKLERİ
========================================================= */

function calculateExpressionMetrics(lm){

  if(!lm || lm.length < 468){

    return {
      mouth:0,
      smile:0,
      eyeL:0,
      eyeR:0,
      brow:0
    };

  }


  const faceHeight =
    distance(
      lm[10],
      lm[152]
    );


  const leftEyeWidth =
    distance(
      lm[33],
      lm[133]
    );


  const rightEyeWidth =
    distance(
      lm[362],
      lm[263]
    );


  const leftEyeHeight =
    distance(
      lm[159],
      lm[145]
    );


  const rightEyeHeight =
    distance(
      lm[386],
      lm[374]
    );


  const mouthWidth =
    distance(
      lm[61],
      lm[291]
    );


  const mouthHeight =
    distance(
      lm[13],
      lm[14]
    );


  return {

    mouth:
      mouthHeight /
      faceHeight,

    smile:
      mouthWidth /
      faceHeight,

    eyeL:
      leftEyeHeight /
      leftEyeWidth,

    eyeR:
      rightEyeHeight /
      rightEyeWidth,

    brow:
      (
        distance(lm[105],lm[1]) +
        distance(lm[334],lm[1])
      ) / 2

  };

}


/* =========================================================
   FACE MESH TRIANGULATION
========================================================= */

/*
  Önceki sürümde yüzün yalnızca birkaç
  üçgeni warp ediliyordu.

  Burada landmark noktalarından otomatik
  Delaunay triangulation oluşturuyoruz.

  Böylece:

  👁 göz
  👄 ağız
  🤨 kaş
  👃 burun
  🙂 yanak

  bölgeleri de ayrı ayrı hareket edebilir.
*/


let meshTriangles = null;


/* =========================================================
   NOKTA
========================================================= */

function pointInTriangle(
  p,
  a,
  b,
  c
){

  const area =
    (
      a.x*(c.y-b.y) +
      b.x*(a.y-c.y) +
      c.x*(b.y-a.y)
    );


  const s =
    (
      a.y*c.x -
      a.x*c.y +
      (c.y-a.y)*p.x +
      (a.x-c.x)*p.y
    ) / area;


  const t =
    (
      a.x*b.y -
      a.y*b.x +
      (a.y-b.y)*p.x +
      (b.x-a.x)*p.y
    ) / area;


  return (
    s >= 0 &&
    t >= 0 &&
    s+t <= 1
  );

}


/* =========================================================
   CIRCUMCIRCLE
========================================================= */

function circumcircle(a,b,c){

  const A =
    b.x-a.x;

  const B =
    b.y-a.y;

  const C =
    c.x-a.x;

  const D =
    c.y-a.y;


  const E =
    A*(a.x+b.x) +
    B*(a.y+b.y);

  const F =
    C*(a.x+c.x) +
    D*(a.y+c.y);


  const G =
    2*(A*(c.y-b.y)-B*(c.x-b.x));


  if(Math.abs(G)<0.000001)
    return null;


  const ox =
    (D*E-B*F)/G;


  const oy =
    (A*F-C*E)/G;


  const r2 =
    (ox-a.x)**2 +
    (oy-a.y)**2;


  return {
    x:ox,
    y:oy,
    r2
  };

}


/* =========================================================
   DELAUNAY
========================================================= */

function createTriangulation(points){

  const pts =
    points.map(
      (p,i)=>({
        x:p.x,
        y:p.y,
        i
      })
    );


  let minX=Infinity;
  let minY=Infinity;
  let maxX=-Infinity;
  let maxY=-Infinity;


  for(const p of pts){

    minX =
      Math.min(minX,p.x);

    minY =
      Math.min(minY,p.y);

    maxX =
      Math.max(maxX,p.x);

    maxY =
      Math.max(maxY,p.y);

  }


  const dx =
    maxX-minX;

  const dy =
    maxY-minY;

  const delta =
    Math.max(dx,dy)*20;


  const midX =
    (minX+maxX)/2;

  const midY =
    (minY+maxY)/2;


  const superA = {
    x:midX-delta,
    y:midY-delta,
    i:-1
  };

  const superB = {
    x:midX,
    y:midY+delta,
    i:-2
  };

  const superC = {
    x:midX+delta,
    y:midY-delta,
    i:-3
  };


  pts.push(
    superA,
    superB,
    superC
  );


  let triangles = [

    {
      a:pts.length-3,
      b:pts.length-2,
      c:pts.length-1
    }

  ];


  for(
    let pIndex=0;
    pIndex<points.length;
    pIndex++
  ){

    const p =
      pts[pIndex];


    const bad=[];


    for(
      let i=0;
      i<triangles.length;
      i++
    ){

      const t =
        triangles[i];


      const cc =
        circumcircle(
          pts[t.a],
          pts[t.b],
          pts[t.c]
        );


      if(!cc)
        continue;


      const d2 =
        (p.x-cc.x)**2 +
        (p.y-cc.y)**2;


      if(d2 <= cc.r2){

        bad.push(i);

      }

    }


    const edges=[];


    for(
      const index
      of bad
    ){

      const t =
        triangles[index];


      edges.push(
        [t.a,t.b],
        [t.b,t.c],
        [t.c,t.a]
      );

    }


    triangles =
      triangles.filter(
        (_,i)=>!bad.includes(i)
      );


    const uniqueEdges=[];


    for(
      const edge
      of edges
    ){

      let found=-1;


      for(
        let i=0;
        i<uniqueEdges.length;
        i++
      ){

        const e =
          uniqueEdges[i];


        if(
          (
            e[0]===edge[1] &&
            e[1]===edge[0]
          ) ||
          (
            e[0]===edge[0] &&
            e[1]===edge[1]
          )
        ){

          found=i;
          break;

        }

      }


      if(found>=0){

        uniqueEdges.splice(
          found,
          1
        );

      }
      else{

        uniqueEdges.push(
          edge
        );

      }

    }


    for(
      const edge
      of uniqueEdges
    ){

      triangles.push({

        a:edge[0],
        b:edge[1],
        c:pIndex

      });

    }

  }


  return triangles
    .filter(
      t =>
        t.a < points.length &&
        t.b < points.length &&
        t.c < points.length
    );

}

========================================================= */

function getFaceMask(){

  const mask =
    document.createElement("canvas");

  mask.width =
    canvas.width;

  mask.height =
    canvas.height;


  const mctx =
    mask.getContext("2d");


  /*
    Yüzün yaklaşık sınırı.
    Çok geniş alanı kapatmasını önlüyoruz.
  */

  const face =
    cameraLandmarks;


  if(!face)
    return null;


  const points = [

    10,
    338,
    297,
    332,
    284,
    251,
    389,
    356,
    454,
    323,
    361,
    288,
    397,
    365,
    379,
    378,
    400,
    377,
    152,
    148,
    176,
    149,
    150,
    136,
    172,
    58,
    132,
    93,
    234,
    127,
    162,
    21,
    54,
    103,
    67,
    109
  ];


  mctx.beginPath();


  const first =
    face[points[0]];


  mctx.moveTo(
    (1-first.x)*canvas.width,
    first.y*canvas.height
  );


  for(
    let i=1;
    i<points.length;
    i++
  ){

    const p =
      face[points[i]];


    mctx.lineTo(
      (1-p.x)*canvas.width,
      p.y*canvas.height
    );

  }


  mctx.closePath();

  mctx.fillStyle =
    "white";

  mctx.fill();


  return mask;

}


/* =========================================================
   SOURCE → TARGET WARP
========================================================= */

function warpFace(
  image,
  source,
  target
){

  ensureTriangulation();


  if(!meshTriangles)
    return;


  const sw =
    image.naturalWidth ||
    image.width;

  const sh =
    image.naturalHeight ||
    image.height;


  /*
    Çok küçük üçgenleri atıyoruz.
  */

  for(
    const tri
    of meshTriangles
  ){

    const s1 =
      source[tri.a];

    const s2 =
      source[tri.b];

    const s3 =
      source[tri.c];


    const t1 =
      target[tri.a];

    const t2 =
      target[tri.b];

    const t3 =
      target[tri.c];


    if(
      !s1 ||
      !s2 ||
      !s3 ||
      !t1 ||
      !t2 ||
      !t3
    )
      continue;


    const sx1 =
      s1.x*sw;

    const sy1 =
      s1.y*sh;

    const sx2 =
      s2.x*sw;

    const sy2 =
      s2.y*sh;

    const sx3 =
      s3.x*sw;

    const sy3 =
      s3.y*sh;


    const dx1 =
      (1-t1.x) *
      canvas.width;

    const dy1 =
      t1.y *
      canvas.height;

    const dx2 =
      (1-t2.x) *
      canvas.width;

    const dy2 =
      t2.y *
      canvas.height;

    const dx3 =
      (1-t3.x) *
      canvas.width;

    const dy3 =
      t3.y *
      canvas.height;


    drawWarpTriangle(

      image,

      sx1,sy1,
      sx2,sy2,
      sx3,sy3,

      dx1,dy1,
      dx2,dy2,
      dx3,dy3

    );

  }

}


/* =========================================================
   AFFINE WARP
========================================================= */

function drawWarpTriangle(

  image,

  sx1,sy1,
  sx2,sy2,
  sx3,sy3,

  dx1,dy1,
  dx2,dy2,
  dx3,dy3

){

  const det =

    sx1*(sy2-sy3) +
    sx2*(sy3-sy1) +
    sx3*(sy1-sy2);


  if(
    Math.abs(det)<0.000001
  )
    return;


  const a =

    (
      dx1*(sy2-sy3) +
      dx2*(sy3-sy1) +
      dx3*(sy1-sy2)
    ) / det;


  const b =

    (
      dy1*(sy2-sy3) +
      dy2*(sy3-sy1) +
      dy3*(sy1-sy2)
    ) / det;


  const c =

    (
      dx1*(sx3-sx2) +
      dx2*(sx1-sx3) +
      dx3*(sx2-sx1)
    ) / det;


  const d =

    (
      dy1*(sx3-sx2) +
      dy2*(sx1-sx3) +
      dy3*(sx2-sx1)
    ) / det;


  const e =

    (
      dx1*(sx2*sy3-sx3*sy2) +
      dx2*(sx3*sy1-sx1*sy3) +
      dx3*(sx1*sy2-sx2*sy1)
    ) / det;


  const f =

    (
      dy1*(sx2*sy3-sx3*sy2) +
      dy2*(sx3*sy1-sx1*sy3) +
      dy3*(sx1*sy2-sx2*sy1)
    ) / det;


  ctx.save();


  ctx.beginPath();

  ctx.moveTo(
    dx1,
    dy1
  );

  ctx.lineTo(
    dx2,
    dy2
  );

  ctx.lineTo(
    dx3,
    dy3
  );

  ctx.closePath();

  ctx.clip();


  ctx.setTransform(
    a,b,c,d,e,f
  );


  ctx.drawImage(
    image,
    0,
    0
  );


  ctx.restore();

}


/* =========================================================
   EXPRESSION RETARGETING
========================================================= */

/*
  Kalibrasyonun asıl amacı burada kullanılıyor.

  Hedefin nötr yüzü:
      calibrationSamples[0]

  Hedefin şu anki yüzü:
      target

  Aradaki fark:
      hedef mimik hareketi

  Bu hareket kaynak yüzün landmarklarına
  uygulanıyor.
*/


function buildExpressionTarget(target){

  if(
    !calibrationSamples.length ||
    !sourceLandmarks
  ){

    return target;

  }


  const neutral =
    calibrationSamples[0].landmarks;


  const result =
    cloneLandmarks(target);


  /*
    Hedef yüzün anlık landmarkları zaten
    mimikleri içeriyor.

    Burada hareketi daha kontrollü hale
    getirmek için yüzün ana bölgelerini
    ekstra güçlendiriyoruz.
  */


  const metrics =
    calculateExpressionMetrics(
      target
    );


  const neutralMetrics =
    calculateExpressionMetrics(
      neutral
    );


  /*
    Mimik şiddetleri
  */

  const mouthDelta =
    metrics.mouth -
    neutralMetrics.mouth;


  const smileDelta =
    metrics.smile -
    neutralMetrics.smile;


  const eyeLDelta =
    metrics.eyeL -
    neutralMetrics.eyeL;


  const eyeRDelta =
    metrics.eyeR -
    neutralMetrics.eyeR;


  const browDelta =
    metrics.brow -
    neutralMetrics.brow;


  /*
    Ağız bölgesi
  */

  const mouthPoints = [

    61,146,91,181,84,
    17,314,405,321,375,
    291,308,415,310,311,
    402,317,14,87,178,
    95,88,185,40,39,
    37,0,267,269,270

  ];


  for(
    const i
    of mouthPoints
  ){

    if(!result[i] || !neutral[i])
      continue;


    /*
      Ağzı dikey olarak daha belirgin
      şekilde takip ettir.
    */

    result[i].y +=
      mouthDelta *
      0.55;


    /*
      Gülümseme sırasında ağız kenarlarını
      yatay olarak aç.
    */

    if(
      i===61 ||
      i===291 ||
      i===146 ||
      i===375
    ){

      const side =
        i===61 ||
        i===146
          ? -1
          : 1;


      result[i].x +=
        smileDelta *
        0.7 *
        side;

    }

  }


  /*
    Gözler
  */

  const leftEye = [
    33,7,163,144,145,153,
    154,155,133,173,157,158,
    159,160,161,246
  ];


  const rightEye = [
    362,382,381,380,374,373,
    390,249,263,466,388,387,
    386,385,384,398
  ];


  for(
    const i
    of leftEye
  ){

    if(!result[i])
      continue;


    result[i].y +=
      -eyeLDelta *
      0.35;

  }


  for(
    const i
    of rightEye
  ){

    if(!result[i])
      continue;


    result[i].y +=
      -eyeRDelta *
      0.35;

  }


  /*
    Kaşlar
  */

  const brows = [

    46,53,52,65,55,70,
    105,107,66,63,

    276,283,282,295,285,
    336,334,296,293

  ];


  for(
    const i
    of brows
  ){

    if(!result[i])
      continue;


    result[i].y +=
      -browDelta *
      0.20;

  }


  return result;

}


/* =========================================================
   FACE SWAP
========================================================= */

function renderSwap(
  targetLandmarks
){

  if(
    !sourceLandmarks ||
    !sourceImageLoaded
  )
    return;


  /*
    Önce gerçek kamerayı çiz.
  */

  ctx.save();

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  /*
    Hedef yüz landmarklarını
    mimik retargeting'den geçir.
  */

  const expressionTarget =
    buildExpressionTarget(
      targetLandmarks
    );


  /*
    Yoğun mesh ile kaynak yüzü
    hedef yüze aktar.
  */

  ctx.save();

  ctx.globalAlpha = 0.98;


  warpFace(
    sourceImage,
    sourceLandmarks,
    expressionTarget
  );


  ctx.restore();


  /*
    Yüz kenarlarını yumuşatmak için
    hafif bir overlay kullanıyoruz.
  */

}
