<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">

<title>AI Yüz Algılama</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  min-height: 100vh;
  background: #080b14;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: min(900px, 100%);
  margin: auto;
  text-align: center;
}

h1 {
  margin: 0 0 8px;
  font-size: 32px;
}

.subtitle {
  color: #9faac3;
  margin-bottom: 22px;
}

.camera {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: #02040a;
  border: 1px solid #29334d;
  border-radius: 18px;
  overflow: hidden;
}

video,
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

video {
  transform: scaleX(-1);
}

canvas {
  pointer-events: none;
  transform: scaleX(-1);
}

.status {
  margin-top: 14px;
  padding: 16px;
  background: #151b2c;
  border-radius: 14px;
  text-align: left;
  white-space: pre-wrap;
  line-height: 1.6;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

button {
  flex: 1;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: #5365ff;
}

button.secondary {
  background: #252d42;
}

button:disabled {
  opacity: 0.4;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 14px;
}

.stat {
  background: #11182a;
  border-radius: 14px;
  padding: 16px;
}

.stat b {
  display: block;
  font-size: 25px;
  margin-bottom: 5px;
}

.stat span {
  color: #9faac3;
}

.diagnostics {
  margin-top: 14px;
  padding: 16px;
  background: #0e1422;
  border: 1px solid #202a40;
  border-radius: 14px;
  text-align: left;
}

.diagnostics h2 {
  margin: 0 0 10px;
  font-size: 18px;
}

pre {
  margin: 0;
  white-space: pre-wrap;
  color: #cdd6ec;
  font-family: monospace;
  font-size: 13px;
  line-height: 1.7;
}

.good {
  color: #9dffca;
}

.bad {
  color: #ff9b9b;
}

@media (max-width: 600px) {
  h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>🤖 AI Yüz Algılama</h1>

  <div class="subtitle">
    Gerçek zamanlı yüz algılama sistemi
  </div>

  <div class="camera">
    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <canvas id="canvas"></canvas>
  </div>

  <div id="status" class="status">
    ⏳ Sistem kontrol ediliyor...
  </div>

  <div class="buttons">

    <button id="startBtn" disabled>
      📷 Kamerayı Başlat
    </button>

    <button
      id="stopBtn"
      class="secondary"
      disabled>
      ⏹ Kamerayı Durdur
    </button>

  </div>

  <div class="stats">

    <div class="stat">
      <b id="faceCount">0</b>
      <span>Yüz</span>
    </div>

    <div class="stat">
      <b id="fps">0</b>
      <span>FPS</span>
    </div>

    <div class="stat">
      <b id="confidence">0%</b>
      <span>Güven</span>
    </div>

    <div class="stat">
      <b id="position">—</b>
      <span>Konum</span>
    </div>

  </div>

  <div class="diagnostics">

    <h2>🔧 Sistem Durumu</h2>

    <pre id="diagnostics">
Başlatılıyor...
    </pre>

  </div>

</div>


<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const faceCount =
  document.getElementById("faceCount");

const fpsElement =
  document.getElementById("fps");

const confidenceElement =
  document.getElementById("confidence");

const positionElement =
  document.getElementById("position");

const diagnostics =
  document.getElementById("diagnostics");


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let detector = null;

let stream = null;

let running = false;

let frameCount = 0;

let lastFpsTime =
  performance.now();


/* =====================================================
   DURUM
===================================================== */

const system = {};


function setSystem(
  name,
  success,
  message
) {

  system[name] = {
    success,
    message
  };

  renderSystem();

}


function renderSystem() {

  const lines = [];

  for (
    const [name, item]
    of Object.entries(system)
  ) {

    lines.push(
      (
        item.success
          ? "✅ "
          : "❌ "
      ) +
      name +
      " — " +
      item.message
    );

  }

  diagnostics.textContent =
    lines.join("\n");

}


/* =====================================================
   TARAYICI KONTROLÜ
===================================================== */

function checkBrowser() {

  if (
    location.protocol === "https:" ||
    location.hostname === "localhost"
  ) {

    setSystem(
      "HTTPS",
      true,
      "Güvenli bağlantı"
    );

  } else {

    setSystem(
      "HTTPS",
      false,
      "HTTPS gerekli"
    );

  }


  if (
    navigator.mediaDevices &&
    navigator.mediaDevices.getUserMedia
  ) {

    setSystem(
      "Kamera API",
      true,
      "Tarayıcı destekliyor"
    );

  } else {

    setSystem(
      "Kamera API",
      false,
      "getUserMedia bulunamadı"
    );

  }


  /*
  Yerleşik FaceDetector
  */

  if (
    "FaceDetector" in window
  ) {

    setSystem(
      "FaceDetector",
      true,
      "Tarayıcı yerleşik yüz algılamayı destekliyor"
    );

    try {

      detector =
        new FaceDetector({
          fastMode: true,
          maxDetectedFaces: 10
        });

      setSystem(
        "FaceDetector motoru",
        true,
        "Motor oluşturuldu"
      );

      startBtn.disabled =
        false;

      status.textContent =
        "✅ AI yüz algılama hazır!\n\n" +
        "Kamerayı başlatabilirsin.";

      status.className =
        "status good";

    }

    catch (error) {

      setSystem(
        "FaceDetector motoru",
        false,
        error.message
      );

      showError(
        "Yüz algılama motoru oluşturulamadı."
      );

    }

  }

  else {

    setSystem(
      "FaceDetector",
      false,
      "Bu ortam yerleşik FaceDetector API'sini desteklemiyor"
    );


    status.textContent =
      "⚠️ Tarayıcı desteği yok.\n\n" +
      "Bu önizleme ortamında yerleşik " +
      "FaceDetector API bulunamadı.\n\n" +
      "Kamera sistemi yine test edilebilir, " +
      "ancak gerçek AI yüz algılama için " +
      "harici veya yerel bir AI modeli gerekir.";

    status.className =
      "status";

  }

}


/* =====================================================
   HATA
===================================================== */

function showError(message) {

  status.textContent =
    "❌ HATA\n\n" +
    message;

  status.className =
    "status bad";

}


/* =====================================================
   KAMERA
===================================================== */

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Kamera API desteklenmiyor."
      );

    }


    status.textContent =
      "📷 Kamera izni bekleniyor...";


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    running =
      true;


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;


    setSystem(
      "Kamera",
      true,
      "Kamera çalışıyor"
    );


    status.textContent =
      "🟢 Kamera açık\n\n" +
      "Yüz aranıyor...";


    requestAnimationFrame(
      detectLoop
    );

  }

  catch (error) {

    setSystem(
      "Kamera",
      false,
      error.message
    );

    showError(
      "Kamera açılamadı:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   KAMERA DURDUR
===================================================== */

function stopCamera() {

  running =
    false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  stream =
    null;

  video.srcObject =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  faceCount.textContent =
    "0";

  fpsElement.textContent =
    "0";

  confidenceElement.textContent =
    "0%";

  positionElement.textContent =
    "—";


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  status.textContent =
    "⏸️ Kamera durduruldu.";

}


/* =====================================================
   YÜZ ALGILAMA
===================================================== */

async function detectLoop() {

  if (!running) {
    return;
  }


  if (
    video.readyState < 2
  ) {

    requestAnimationFrame(
      detectLoop
    );

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  try {

    const faces =
      await detector.detect(
        video
      );


    faceCount.textContent =
      faces.length;


    let highest =
      0;


    for (
      const face
      of faces
    ) {

      const box =
        face.boundingBox;


      if (!box) {
        continue;
      }


      /*
      Yüz kutusu
      */

      ctx.strokeStyle =
        "#00ff88";

      ctx.lineWidth =
        4;


      ctx.strokeRect(
        box.x,
        box.y,
        box.width,
        box.height
      );


      /*
      Merkez
      */

      const centerX =
        Math.round(
          box.x +
          box.width / 2
        );

      const centerY =
        Math.round(
          box.y +
          box.height / 2
        );


      positionElement.textContent =
        centerX +
        ", " +
        centerY;


      /*
      Yerleşik FaceDetector
      confidence vermiyorsa
      kutu varlığını gösteriyoruz.
      */

      highest =
        Math.max(
          highest,
          1
        );


      /*
      Etiket
      */

      ctx.fillStyle =
        "#00ff88";

      ctx.font =
        "bold 18px Arial";

      ctx.fillText(
        "YÜZ",
        box.x,
        Math.max(
          22,
          box.y - 8
        )
      );

    }


    confidenceElement.textContent =
      faces.length
        ? "Algılandı"
        : "0%";


    /*
    FPS
    */

    frameCount++;

    const now =
      performance.now();

    const elapsed =
      now - lastFpsTime;


    if (elapsed >= 1000) {

      fpsElement.textContent =
        Math.round(
          frameCount /
          (elapsed / 1000)
        );


      frameCount =
        0;

      lastFpsTime =
        now;

    }

  }

  catch (error) {

    console.error(
      "Yüz algılama:",
      error
    );

    setSystem(
      "Yüz algılama",
      false,
      error.message
    );

  }


  requestAnimationFrame(
    detectLoop
  );

}


/* =====================================================
   BUTONLAR
===================================================== */

startBtn.addEventListener(
  "click",
  startCamera
);

stopBtn.addEventListener(
  "click",
  stopCamera
);


/* =====================================================
   BAŞLAT
===================================================== */

checkBrowser();

</script>

</body>
</html>
