<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon AI Face Swap</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b16;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}
.app{max-width:980px;margin:auto}
.head{text-align:center;padding:12px 4px 18px}
.head h1{margin:0;font-size:clamp(27px,7vw,44px);background:linear-gradient(90deg,#8b7cff,#45d8ff);-webkit-background-clip:text;color:transparent}
.head p{margin:8px 0 0;color:#9ca8c2}
.stage{position:relative;aspect-ratio:16/10;background:#02050b;border:1px solid #283657;border-radius:20px;overflow:hidden;box-shadow:0 0 35px #151d40}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{background:#10182a;border:1px solid #273453;border-radius:16px;padding:14px}
.card h2{font-size:17px;margin:0 0 10px}
.upload{display:block;background:linear-gradient(135deg,#704cff,#9b62ff);padding:15px;border-radius:12px;text-align:center;font-weight:800;cursor:pointer}
.upload input{display:none}
button{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;color:white;background:#12c978}
button.stop{background:#26314a}
button:disabled{opacity:.45}
.status{margin-top:12px;padding:15px;border-radius:14px;background:#10182a;border:1px solid #273453;line-height:1.5}
.ok{color:#70ffba}.err{color:#ff8f9c}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{background:#0e1627;border-radius:13px;padding:13px;text-align:center}
.stat b{display:block;font-size:23px}.stat span{font-size:12px;color:#94a1bc}
.note{margin-top:12px;color:#8996b0;font-size:12px;line-height:1.5}
@media(max-width:650px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="head"><h1>🤖 AI Yüz Değiştirme</h1><p>Kendi yüzünü yükle • kamerayı aç • hedef yüz üzerinde canlı gör</p></div>
<div class="stage"><canvas id="out"></canvas></div>
<div class="controls">
<div class="card">
<h2>1. Kendi yüzünü yükle</h2>
<label class="upload">🖼️ Fotoğraf Seç<input id="photo" type="file" accept="image/*"></label>
<div id="photoState" class="note">Henüz kaynak yüz seçilmedi.</div>
</div>
<div class="card">
<h2>2. Kamera</h2>
<button id="start">📷 Kamerayı Başlat</button>
<div style="height:8px"></div>
<button id="stop" class="stop" disabled>⏹ Kamerayı Durdur</button>
</div>
</div>
<div id="status" class="status">⏳ Face Mesh hazırlanıyor...</div>
<div class="stats">
<div class="stat"><b id="faces">0</b><span>Yüz</span></div>
<div class="stat"><b id="fps">0</b><span>FPS</span></div>
<div class="stat"><b id="mode">Hazır</b><span>Durum</span></div>
</div>
<div class="note">🔒 Fotoğraf tarayıcıda işlenir; sunucuya gönderilmez. Yalnızca izinli fotoğraf ve kişilerle kullan.</div>
</div>

<img id="source" style="display:none" alt="source">
<video id="video" autoplay muted playsinline style="display:none"></video>

<script>
const video=document.getElementById('video');
const out=document.getElementById('out');
const ctx=out.getContext('2d');
const source=document.getElementById('source');
const photo=document.getElementById('photo');
const start=document.getElementById('start');
const stop=document.getElementById('stop');
const status=document.getElementById('status');
const facesEl=document.getElementById('faces');
const fpsEl=document.getElementById('fps');
const modeEl=document.getElementById('mode');
const photoState=document.getElementById('photoState');

let mesh=null,camera=null,stream=null,sourceLm=null,sourceReady=false,running=false;
let sourceURL=null,last=performance.now(),frames=0,meshMode='live',sourceResolve=null;

const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

function msg(t,err=false){
  status.textContent=t;
  status.className='status '+(err?'err':'ok');
}
function pt(lm,i,w,h){
  const q=lm[i];
  return {x:q.x*w,y:q.y*h};
}
function bounds(lm,w,h){
  let x0=1,y0=1,x1=0,y1=0;
  for(const q of lm){
    x0=Math.min(x0,q.x); y0=Math.min(y0,q.y);
    x1=Math.max(x1,q.x); y1=Math.max(y1,q.y);
  }
  const ex=(x1-x0)*.16, ey=(y1-y0)*.18;
  return {x:(x0-ex)*w,y:(y0-ey)*h,w:(x1-x0+2*ex)*w,h:(y1-y0+2*ey)*h};
}
function eyes(lm,w,h){
  const a=pt(lm,33,w,h),b=pt(lm,263,w,h);
  return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,angle:Math.atan2(b.y-a.y,b.x-a.x),dist:Math.hypot(b.x-a.x,b.y-a.y)};
}
function clipFace(lm,w,h){
  ctx.beginPath();
  let q=pt(lm,OVAL[0],w,h);
  ctx.moveTo(q.x,q.y);
  for(let i=1;i<OVAL.length;i++){
    q=pt(lm,OVAL[i],w,h);
    ctx.lineTo(q.x,q.y);
  }
  ctx.closePath();
  ctx.clip();
}
function drawSwap(target){
  if(!sourceReady||!sourceLm||!target)return;

  const tw=out.width,th=out.height,sw=source.naturalWidth,sh=source.naturalHeight;
  const se=eyes(sourceLm,sw,sh);
  const te=eyes(target,tw,th);
  const scale=te.dist/se.dist;

  ctx.save();
  clipFace(target,tw,th);
  ctx.translate(te.x,te.y);
  ctx.rotate(te.angle-se.angle);
  ctx.scale(scale,scale);
  ctx.globalAlpha=.97;
  ctx.drawImage(source,-se.x,-se.y,sw,sh);
  ctx.restore();
}
function onResults(r){
  if(meshMode==='source'){
    sourceLm=r.multiFaceLandmarks&&r.multiFaceLandmarks[0]?r.multiFaceLandmarks[0]:null;
    sourceReady=!!sourceLm;
    if(sourceResolve){sourceResolve();sourceResolve=null}
    meshMode='live';
    return;
  }

  const list=r.multiFaceLandmarks||[];
  facesEl.textContent=list.length;

  if(running){
    ctx.save();
    ctx.scale(-1,1);
    ctx.drawImage(r.image,-out.width,0,out.width,out.height);
    ctx.restore();
    if(list[0]) drawSwap(list[0]);
  }

  modeEl.textContent=sourceReady?(list.length?'Aktif':'Yüz bekleniyor'):'Kaynak yok';

  frames++;
  const now=performance.now();
  if(now-last>1000){
    fpsEl.textContent=Math.round(frames*1000/(now-last));
    frames=0;
    last=now;
  }
}

function init(){
  try{
    if(typeof FaceMesh==='undefined') throw new Error('Face Mesh yüklenemedi.');
    mesh=new FaceMesh({
      locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    mesh.setOptions({
      maxNumFaces:1,
      refineLandmarks:true,
      minDetectionConfidence:.55,
      minTrackingConfidence:.55
    });
    mesh.onResults(onResults);
    start.disabled=false;
    msg('✅ AI hazır. Önce kendi yüzünün net bir fotoğrafını seç.');
  }catch(e){
    msg('❌ AI başlatılamadı: '+e.message,true);
  }
}

photo.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;

  if(sourceURL)URL.revokeObjectURL(sourceURL);
  sourceURL=URL.createObjectURL(file);
  source.src=sourceURL;

  source.onload=async()=>{
    sourceReady=false;
    photoState.textContent='⏳ Kaynak yüz analiz ediliyor...';
    meshMode='source';

    await new Promise(resolve=>{
      sourceResolve=resolve;
      mesh.send({image:source}).catch(err=>{
        sourceResolve=null;
        msg('❌ Fotoğraf analiz edilemedi: '+err.message,true);
        resolve();
      });
    });

    if(sourceReady){
      photoState.textContent='✅ Kaynak yüz hazır';
      msg('🟢 Kaynak yüz hazır. Şimdi kamerayı başlat.');
    }else{
      photoState.textContent='❌ Fotoğrafta net yüz bulunamadı';
      msg('Fotoğrafta net bir yüz bulunamadı. Daha önden çekilmiş bir fotoğraf dene.',true);
    }
  };
});

async function startCamera(){
  if(!sourceReady){
    msg('Önce kendi yüzünün fotoğrafını yükle.',true);
    return;
  }

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    out.width=video.videoWidth||1280;
    out.height=video.videoHeight||720;

    running=true;
    start.disabled=true;
    stop.disabled=false;

    msg('🟢 Yüz değiştirme aktif. Kameradaki ilk yüz takip ediliyor.');

    camera=new Camera(video,{
      onFrame:async()=>{
        if(running)await mesh.send({image:video});
      },
      width:1280,
      height:720
    });
    camera.start();
  }catch(e){
    msg('❌ Kamera açılamadı: '+e.message,true);
  }
}

function stopCamera(){
  running=false;

  if(camera){
    try{camera.stop()}catch(e){}
    camera=null;
  }

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  ctx.clearRect(0,0,out.width,out.height);
  start.disabled=false;
  stop.disabled=true;
  facesEl.textContent='0';
  fpsEl.textContent='0';
  modeEl.textContent='Hazır';
  msg(sourceReady?'Kaynak yüz hazır. Kamerayı yeniden başlatabilirsin.':'Önce kaynak yüzü yükle.');
}

start.onclick=startCamera;
stop.onclick=stopCamera;

window.addEventListener('beforeunload',()=>{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(sourceURL)URL.revokeObjectURL(sourceURL);
});

init();
</script>
</body>
</html>
