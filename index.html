<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#080b14"
>

<title>AI Yüz Algılama</title>


<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
  crossorigin="anonymous">
</script>

<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
  crossorigin="anonymous">
</script>

<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"
  crossorigin="anonymous">
</script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 18px;

  background:
    #080b14;

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}

.app {

  width:
    min(900px, 100%);

  margin:
    auto;

  text-align:
    center;

}

h1 {

  margin:
    0 0 8px;

  font-size:
    32px;

}

.subtitle {

  color:
    #9faac3;

  margin-bottom:
    22px;

}


/* =====================================================
   KAMERA
===================================================== */

.camera {

  position:
    relative;

  width:
    100%;

  aspect-ratio:
    16 / 10;

  background:
    #02040a;

  border:
    1px solid #29334d;

  border-radius:
    18px;

  overflow:
    hidden;

}

video,
canvas {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;

}

video {

  transform:
    scaleX(-1);

}

canvas {

  pointer-events:
    none;

  transform:
    scaleX(-1);

}


/* =====================================================
   DURUM
===================================================== */

.status {

  margin-top:
    14px;

  padding:
    16px;

  background:
    #151b2c;

  border-radius:
    14px;

  text-align:
    left;

  white-space:
    pre-wrap;

  line-height:
    1.6;

}

.success {

  color:
    #9dffca;

}

.error {

  color:
    #ff9b9b;

}


/* =====================================================
   BUTONLAR
===================================================== */

.buttons {

  display:
    flex;

  gap:
    10px;

  margin-top:
    14px;

}

button {

  flex:
    1;

  border:
    0;

  border-radius:
    12px;

  padding:
    15px;

  font-size:
    16px;

  font-weight:
    bold;

  color:
    white;

  background:
    #5365ff;

}

button.secondary {

  background:
    #252d42;

}

button:disabled {

  opacity:
    .4;

}


/* =====================================================
   İSTATİSTİK
===================================================== */

.stats {

  display:
    grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:
    10px;

  margin-top:
    14px;

}

.stat {

  background:
    #11182a;

  border-radius:
    14px;

  padding:
    16px;

}

.stat b {

  display:
    block;

  font-size:
    25px;

  margin-bottom:
    5px;

}

.stat span {

  color:
    #9faac3;

}


/* =====================================================
   TEŞHİS
===================================================== */

.diagnostics {

  margin-top:
    14px;

  padding:
    16px;

  background:
    #0e1422;

  border:
    1px solid #202a40;

  border-radius:
    14px;

  text-align:
    left;

}

.diagnostics h2 {

  margin:
    0 0 10px;

  font-size:
    18px;

}

pre {

  margin:
    0;

  white-space:
    pre-wrap;

  color:
    #cdd6ec;

  font-family:
    monospace;

  font-size:
    13px;

  line-height:
    1.7;

}


@media (max-width: 600px) {

  h1 {

    font-size:
      27px;

  }

}

</style>

</head>


<body>


<div class="app">


<h1>
  🤖 AI Yüz Algılama
</h1>


<div class="subtitle">
  Gerçek zamanlı yüz algılama sistemi
</div>


<div class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <canvas
    id="canvas">
  </canvas>

</div>


<div
  id="status"
  class="status">

  ⏳ MediaPipe hazırlanıyor...

</div>


<div class="buttons">

  <button
    id="startBtn"
    disabled>

    📷 Kamerayı Başlat

  </button>


  <button
    id="stopBtn"
    class="secondary"
    disabled>

    ⏹ Kamerayı Durdur

  </button>

</div>


<div class="stats">


  <div class="stat">

    <b id="faceCount">
      0
    </b>

    <span>
      Yüz
    </span>

  </div>


  <div class="stat">

    <b id="fps">
      0
    </b>

    <span>
      FPS
    </span>

  </div>


  <div class="stat">

    <b id="confidence">
      0%
    </b>

    <span>
      Güven
    </span>

  </div>


  <div class="stat">

    <b id="position">
      —
    </b>

    <span>
      Konum
    </span>

  </div>


</div>


<div class="diagnostics">

  <h2>
    🔧 Sistem Durumu
  </h2>

  <pre id="diagnostics">
Başlatılıyor...
  </pre>

</div>


</div>



<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const faceCount =
  document.getElementById("faceCount");

const fpsElement =
  document.getElementById("fps");

const confidenceElement =
  document.getElementById("confidence");

const positionElement =
  document.getElementById("position");

const diagnostics =
  document.getElementById("diagnostics");


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let faceDetection = null;

let camera = null;

let stream = null;

let running = false;

let frames = 0;

let lastFpsTime =
  performance.now();


/* =====================================================
   SİSTEM DURUMU
===================================================== */

const states = {};


function setState(
  name,
  success,
  message
) {

  states[name] = {

    success,
    message

  };

  renderStates();

}


function renderStates() {

  diagnostics.textContent =
    Object.entries(states)
      .map(
        ([name, item]) => {

          return (
            (item.success
              ? "✅ "
              : "❌ ") +

            name +

            " — " +

            item.message

          );

        }
      )
      .join("\n");

}


/* =====================================================
   MEDIAPIPE KONTROL
===================================================== */

async function initializeAI() {

  try {


    setState(
      "HTTPS",
      location.protocol === "https:",
      location.protocol === "https:"
        ? "Güvenli bağlantı"
        : "HTTPS gerekli"
    );


    /*
    -----------------------------------------------------
    CAMERA API
    -----------------------------------------------------
    */

    const cameraSupported =
      !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      );


    setState(
      "Kamera API",
      cameraSupported,
      cameraSupported
        ? "Tarayıcı destekliyor"
        : "getUserMedia bulunamadı"
    );


    /*
    -----------------------------------------------------
    MEDIAPIPE
    -----------------------------------------------------
    */

    if (
      typeof FaceDetection ===
      "undefined"
    ) {

      throw new Error(
        "MediaPipe FaceDetection yüklenemedi."
      );

    }


    if (
      typeof Camera ===
      "undefined"
    ) {

      throw new Error(
        "MediaPipe Camera yardımcı aracı yüklenemedi."
      );

    }


    setState(
      "MediaPipe",
      true,
      "Kütüphane yüklendi"
    );


    /*
    -----------------------------------------------------
    FACE DETECTION
    -----------------------------------------------------
    */

    faceDetection =
      new FaceDetection({

        locateFile:
          function(file) {

            return (
              "https://cdn.jsdelivr.net/npm/" +
              "@mediapipe/face_detection/" +
              file
            );

          }

      });


    faceDetection.setOptions({

      model:
        "short",

      selfieMode:
        true,

      minDetectionConfidence:
        0.5

    });


    faceDetection.onResults(
      onResults
    );


    setState(
      "Yüz modeli",
      true,
      "BlazeFace hazır"
    );


    setState(
      "AI sistemi",
      true,
      "Kamera için hazır"
    );


    status.textContent =
      "✅ AI sistemi hazır!\n\n" +
      "Kamerayı başlatabilirsin.";

    status.className =
      "status success";


    startBtn.disabled =
      false;


  }

  catch (error) {

    console.error(
      error
    );


    setState(
      "AI sistemi",
      false,
      error.message ||
      String(error)
    );


    status.textContent =
      "❌ AI sistemi başlatılamadı.\n\n" +
      "Hata:\n" +
      (
        error.message ||
        String(error)
      );

    status.className =
      "status error";

  }

}


/* =====================================================
   SONUÇLAR
===================================================== */

function onResults(
  results
) {

  if (!running) {
    return;
  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const detections =
    results.detections ||
    [];


  /*
  -----------------------------------------------------
  YÜZ SAYISI
  -----------------------------------------------------
  */

  faceCount.textContent =
    detections.length;


  let highestConfidence =
    0;


  /*
  -----------------------------------------------------
  YÜZLER
  -----------------------------------------------------
  */

  for (
    const detection
    of detections
  ) {


    const box =
      detection.boundingBox;


    if (!box) {
      continue;
    }


    /*
    ---------------------------------------------------
    GÜVEN
    ---------------------------------------------------
    */

    if (
      detection.score &&
      detection.score.length
    ) {

      highestConfidence =
        Math.max(
          highestConfidence,
          detection.score[0]
        );

    }


    /*
    ---------------------------------------------------
    KUTU
    ---------------------------------------------------
    */

    const x =
      box.xCenter -
      box.width / 2;

    const y =
      box.yCenter -
      box.height / 2;


    const width =
      box.width;

    const height =
      box.height;


    ctx.strokeStyle =
      "#00ff88";

    ctx.lineWidth =
      4;


    ctx.strokeRect(
      x,
      y,
      width,
      height
    );


    /*
    ---------------------------------------------------
    MERKEZ
    ---------------------------------------------------
    */

    const centerX =
      Math.round(
        box.xCenter
      );

    const centerY =
      Math.round(
        box.yCenter
      );


    positionElement.textContent =
      centerX +
      ", " +
      centerY;


    /*
    ---------------------------------------------------
    ETİKET
    ---------------------------------------------------
    */

    ctx.fillStyle =
      "#00ff88";

    ctx.font =
      "bold 18px Arial";


    ctx.fillText(
      "YÜZ",
      x,
      Math.max(
        24,
        y - 8
      )
    );


    /*
    ---------------------------------------------------
    LANDMARK NOKTALARI
    ---------------------------------------------------
    */

    if (
      detection.landmarks
    ) {

      for (
        const point
        of detection.landmarks
      ) {

        const px =
          point.x *
          canvas.width;

        const py =
          point.y *
          canvas.height;


        ctx.beginPath();

        ctx.arc(
          px,
          py,
          4,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          "#00eaff";

        ctx.fill();

      }

    }

  }


  /*
  -----------------------------------------------------
  GÜVEN
  -----------------------------------------------------
  */

  confidenceElement.textContent =
    detections.length
      ? Math.round(
          highestConfidence * 100
        ) + "%"
      : "0%";


  /*
  -----------------------------------------------------
  FPS
  -----------------------------------------------------
  */

  frames++;


  const now =
    performance.now();


  const elapsed =
    now -
    lastFpsTime;


  if (
    elapsed >= 1000
  ) {

    fpsElement.textContent =
      Math.round(
        frames /
        (elapsed / 1000)
      );


    frames =
      0;

    lastFpsTime =
      now;

  }

}


/* =====================================================
   KAMERA BAŞLAT
===================================================== */

async function startCamera() {

  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Kamera API desteklenmiyor."
      );

    }


    status.textContent =
      "📷 Kamera izni bekleniyor...";


    /*
    ---------------------------------------------------
    KAMERAYI DOĞRUDAN AÇ
    ---------------------------------------------------
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            "user",

          width: {

            ideal:
              1280

          },

          height: {

            ideal:
              720

          }

        },

        audio:
          false

      });


    video.srcObject =
      stream;


    await video.play();


    running =
      true;


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;


    setState(
      "Kamera",
      true,
      "Kamera çalışıyor"
    );


    status.textContent =
      "🟢 Kamera açık\n\n" +
      "AI yüz arıyor...";


    /*
    ---------------------------------------------------
    MEDIAPIPE KAMERA DÖNGÜSÜ
    ---------------------------------------------------
    */

    camera =
      new Camera(
        video,
        {

          onFrame:
            async function() {

              if (
                running &&
                faceDetection
              ) {

                await faceDetection.send({
                  image: video
                });

              }

            },

          width:
            1280,

          height:
            720

        }
      );


    camera.start();


  }

  catch (error) {

    console.error(
      error
    );


    setState(
      "Kamera",
      false,
      error.message ||
      String(error)
    );


    status.textContent =
      "❌ Kamera açılamadı.\n\n" +
      (
        error.message ||
        String(error)
      );

    status.className =
      "status error";

  }

}


/* =====================================================
   KAMERA DURDUR
===================================================== */

function stopCamera() {

  running =
    false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  faceCount.textContent =
    "0";

  fpsElement.textContent =
    "0";

  confidenceElement.textContent =
    "0%";

  positionElement.textContent =
    "—";


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  status.textContent =
    "⏸️ Kamera durduruldu.";

}


/* =====================================================
   BUTONLAR
===================================================== */

startBtn.addEventListener(
  "click",
  startCamera
);


stopBtn.addEventListener(
  "click",
  stopCamera
);


/* =====================================================
   BAŞLAT
===================================================== */

initializeAI();

</script>

</body>
</html>
